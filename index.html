<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>南京旅游攻略打卡地图</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 1. 高德地图安全密钥配置 -->
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: "514a23571b3ffbf7725fb77dc7ddcca7", 
    };
  </script>
  <!-- 2. 加载高德地图 JS API 2.0 核心与全部所需插件 -->
  <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=265a60ea1a814174cc37ffee8c260055&plugin=AMap.ToolBar,AMap.Scale,AMap.Geolocation,AMap.Transfer,AMap.Driving,AMap.PlaceSearch,AMap.AutoComplete,AMap.Geocoder"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(10px, env(safe-area-inset-top)); }
    .amap-info-content { padding: 0 !important; border-radius: 14px !important; overflow: hidden; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased overflow-hidden h-[100dvh] w-screen flex flex-col md:flex-row relative select-none">

  <!-- ========================================================
       【电脑端 UI】左侧工作台侧边栏 (md:flex)
  ======================================================== -->
  <aside id="desktop-sidebar" class="hidden md:flex md:w-96 h-full bg-white border-r border-slate-200 z-20 flex-col shadow-xl transition-all duration-300">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
      <div>
        <h1 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="map-pin" class="w-5 h-5 text-emerald-600"></i>
          南京行程规划助手
        </h1>
        <p id="desktop-gps-status-text" class="text-[11px] text-emerald-700 font-medium mt-0.5">默认起点：全季酒店(老门东店)</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="resetToDefaultSpots()" title="恢复初始推荐景点" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>
        <button onclick="exportCurrentSpotsToCode()" title="导出代码同步到GitHub" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-900 text-white text-xs font-semibold rounded-xl flex items-center gap-1 shadow transition">
          <i data-lucide="share" class="w-3.5 h-3.5"></i>
          <span>导出配置</span>
        </button>
      </div>
    </div>

    <!-- 电脑端搜索框与模糊推荐容器 -->
    <div class="p-3 border-b border-slate-100 space-y-2 relative">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5 pointer-events-none"></i>
        <input 
          id="desktop-search-input" 
          type="text" 
          placeholder="输入南京地点(如: 鸡鸣寺、科巷)..." 
          autocomplete="off"
          class="w-full pl-8 pr-2 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 transition"
          oninput="handleSearchInput(this.value, 'desktop-suggest-list')"
          onfocus="handleSearchInput(this.value, 'desktop-suggest-list')"
        />
        <!-- 模糊搜索下拉推荐面板 -->
        <div id="desktop-suggest-list" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-2xl shadow-2xl z-50 max-h-80 overflow-y-auto p-1.5 space-y-1"></div>
      </div>

      <div class="flex items-center justify-between gap-2">
        <button id="desktop-add-mode-btn" onclick="toggleAddMode()" class="flex-1 py-1.5 bg-slate-50 border border-emerald-500 text-emerald-600 text-xs font-medium rounded-xl flex items-center justify-center gap-1 hover:bg-emerald-50 transition">
          <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
          <span>地图选点</span>
        </button>
        <button onclick="getUserLocation()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 text-slate-600 text-xs rounded-xl flex items-center gap-1 hover:bg-slate-100 transition">
          <i data-lucide="locate-fixed" class="w-3.5 h-3.5 text-emerald-600"></i>
          <span>刷新实时定位</span>
        </button>
      </div>
    </div>

    <!-- 电脑端日程过滤 -->
    <div class="p-2 border-b border-slate-100 flex gap-1 bg-slate-50/70 overflow-x-auto no-scrollbar">
      <button onclick="filterDay('all')" class="day-filter-btn flex-1 py-1.5 text-xs rounded-lg font-medium bg-emerald-600 text-white shadow-sm transition" data-day="all">全部</button>
      <button onclick="filterDay(1)" class="day-filter-btn flex-1 py-1.5 text-xs rounded-lg font-medium bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100 transition" data-day="1">D1</button>
      <button onclick="filterDay(2)" class="day-filter-btn flex-1 py-1.5 text-xs rounded-lg font-medium bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100 transition" data-day="2">D2</button>
      <button onclick="filterDay(3)" class="day-filter-btn flex-1 py-1.5 text-xs rounded-lg font-medium bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100 transition" data-day="3">D3</button>
      <button onclick="filterDay(0)" class="day-filter-btn flex-1 py-1.5 text-xs rounded-lg font-medium bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100 transition" data-day="0">备选</button>
    </div>

    <!-- 电脑端景点打卡列表容器 -->
    <div id="desktop-spot-list" class="flex-1 overflow-y-auto p-3 space-y-2.5"></div>

    <div class="p-3 bg-slate-50 border-t border-slate-100 text-[11px] text-slate-500 flex justify-between items-center">
      <span id="desktop-spot-count">共 0 个打卡点</span>
      <span class="text-emerald-600">点击卡片定位 · 点路线看换乘</span>
    </div>
  </aside>

  <!-- ========================================================
       【手机端 UI】顶部悬浮流 (md:hidden)
  ======================================================== -->
  <header class="md:hidden absolute top-0 left-0 right-0 z-30 pointer-events-none safe-top px-3">
    <div class="flex flex-col gap-2 max-w-md mx-auto">
      
      <!-- 第一层：搜索框 + 选点 + 定位 + 导出 -->
      <div class="relative pointer-events-auto bg-white/95 backdrop-blur-md rounded-2xl shadow-lg border border-slate-200/80 p-1.5 flex items-center gap-1.5">
        <div class="relative flex-1 flex items-center min-w-0">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 pointer-events-none"></i>
          <input 
            id="mobile-search-input" 
            type="text" 
            placeholder="搜南京景点(如:鸡鸣寺、科巷)..." 
            autocomplete="off"
            class="w-full pl-8 pr-2 py-1.5 text-xs bg-slate-50 border border-slate-200/60 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 transition"
            oninput="handleSearchInput(this.value, 'mobile-suggest-list')"
            onfocus="handleSearchInput(this.value, 'mobile-suggest-list')"
          />
        </div>

        <button id="mobile-add-mode-btn" onclick="toggleAddMode()" class="px-2 py-1.5 bg-white border border-emerald-500 text-emerald-600 text-xs font-medium rounded-xl flex items-center gap-1 flex-shrink-0">
          <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
          <span>选点</span>
        </button>

        <button onclick="getUserLocation()" title="当前定位" class="p-1.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 active:bg-slate-100 flex-shrink-0">
          <i data-lucide="locate-fixed" class="w-4 h-4 text-emerald-600"></i>
        </button>

        <button onclick="exportCurrentSpotsToCode()" title="复制数据" class="px-2 py-1.5 bg-slate-800 text-white text-xs font-semibold rounded-xl flex items-center gap-1 flex-shrink-0 shadow">
          <i data-lucide="share" class="w-3 h-3"></i>
          <span>导出</span>
        </button>

        <!-- 手机端模糊推荐下拉面板 -->
        <div id="mobile-suggest-list" class="hidden absolute top-full left-0 right-0 mt-2 bg-white/98 backdrop-blur-md border border-slate-200 rounded-2xl shadow-2xl z-50 max-h-64 overflow-y-auto p-1.5 space-y-1"></div>
      </div>

      <!-- 第二层：日程横向单行滑动 -->
      <div class="pointer-events-auto flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 px-0.5">
        <button onclick="filterDay('all')" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-emerald-600 text-white shadow-md transition" data-day="all">全部日程</button>
        <button onclick="filterDay(1)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="1">D1 钟山秦淮</button>
        <button onclick="filterDay(2)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="2">D2 总统府民国</button>
        <button onclick="filterDay(3)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="3">D3 玄武湖风光</button>
        <button onclick="filterDay(0)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="0">备选打卡</button>
      </div>

      <!-- 第三层：定位状态 -->
      <div class="pointer-events-auto self-start">
        <div class="bg-slate-900/85 backdrop-blur-sm text-white text-[11px] px-2.5 py-1 rounded-full shadow flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="mobile-gps-status-text">默认起点：全季酒店(老门东店)</span>
        </div>
      </div>

    </div>
  </header>

  <!-- ========================================================
       地图容器主体
  ======================================================== -->
  <main class="flex-1 h-full w-full relative">
    <div id="amap-container" class="w-full h-full"></div>

    <!-- 选点状态浮条 -->
    <div id="add-mode-toast" class="hidden absolute top-28 md:top-6 left-1/2 -translate-x-1/2 z-30 bg-slate-900/95 text-white text-xs px-4 py-2 rounded-full shadow-lg flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      在地图任意位置轻点，即可新增打卡点并自动测算路线
      <button onclick="toggleAddMode()" class="ml-2 underline text-emerald-300">取消</button>
    </div>
  </main>

  <!-- ========================================================
       【手机端 UI】底部抽屉 (md:hidden)
  ======================================================== -->
  <div id="bottom-drawer" class="md:hidden fixed left-0 right-0 bottom-0 z-20 bg-white/95 backdrop-blur-md rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.15)] border-t border-slate-200 transition-all duration-300 flex flex-col max-h-[75dvh] h-[230px]">
    <div onclick="toggleDrawerHeight()" class="pt-2 pb-1.5 flex flex-col items-center cursor-pointer">
      <div class="w-10 h-1 bg-slate-300 rounded-full mb-1.5"></div>
      <div class="flex items-center justify-between w-full px-5 text-xs text-slate-500 font-medium">
        <span id="mobile-spot-count-text">共 0 个打卡点</span>
        <span class="text-emerald-600 flex items-center gap-0.5">
          <span id="drawer-toggle-tip">上滑展开列表</span>
          <i id="drawer-toggle-icon" data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
        </span>
      </div>
    </div>

    <div id="mobile-spot-list" class="flex-1 overflow-y-auto px-4 py-2 space-y-2 safe-bottom"></div>
  </div>

  <!-- ========================================================
       自定义添加/编辑打卡点弹窗 (自动计算最短时间地铁/公交并填入)
  ======================================================== -->
  <div id="custom-add-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-5 space-y-3.5 transform transition-all border border-slate-100">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div class="min-w-0 pr-2">
          <h3 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
            <i data-lucide="map-pin-plus" class="w-5 h-5 text-emerald-600 flex-shrink-0"></i>
            <span>定制打卡点攻略</span>
          </h3>
          <p id="form-subtitle" class="text-[11px] text-slate-400 truncate mt-0.5">详细地址加载中...</p>
        </div>
        <button onclick="closeAddSpotModal()" class="p-1.5 rounded-full text-slate-400 hover:bg-slate-100">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">打卡点名称</label>
          <input id="form-spot-name" type="text" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 font-medium" />
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">安排到哪一天</label>
            <select id="form-spot-day" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 font-medium text-emerald-700">
              <option value="1">Day 1 (钟山秦淮)</option>
              <option value="2">Day 2 (总统府民国)</option>
              <option value="3">Day 3 (玄武湖风光)</option>
              <option value="0">机动 / 备选打卡</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">预计游玩时长</label>
            <input id="form-spot-time" type="text" value="1.5-2小时" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>

        <!-- 推荐公共交通：自动计算最短时间几号线/几路公交，支持一键清空重写 -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-semibold text-slate-700 flex items-center gap-1">
              <span>推荐公共交通 (按最短耗时自动生成)</span>
            </label>
            <button type="button" onclick="document.getElementById('form-spot-transit').value=''; document.getElementById('form-spot-transit').focus();" class="text-[11px] text-rose-500 hover:underline">
              清空自己填
            </button>
          </div>
          <textarea id="form-spot-transit" rows="2" placeholder="正在从起点测算最短时间的地铁/公交路线..." class="w-full px-3 py-2 bg-blue-50/50 border border-blue-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 text-slate-700 leading-relaxed"></textarea>
          <p id="form-transit-hint" class="text-[10px] text-slate-400 mt-1">起点基准：全季酒店(南京老门东店)，可自由删改上方文字</p>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">攻略简短信息 & 避坑备注</label>
          <textarea id="form-spot-tip" rows="2" placeholder="填写必拍机位、预约提醒、必吃美食等..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 leading-relaxed"></textarea>
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">门票/人均费用</label>
            <input id="form-spot-cost" type="text" value="免费" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">分类标签</label>
            <input id="form-spot-cat" type="text" value="景点打卡" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="closeAddSpotModal()" class="flex-1 py-2.5 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">取消</button>
        <button onclick="submitSaveNewSpot()" class="flex-1 py-2.5 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md transition">确认加入行程</button>
      </div>
    </div>
  </div>

  <!-- ========================================================
       路线导航弹窗 (展示具体地铁/公交几号线、多少站、打车时间)
  ======================================================== -->
  <div id="nav-modal" class="fixed inset-x-0 bottom-0 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-[480px] z-40 bg-white rounded-t-3xl md:rounded-3xl shadow-2xl border border-slate-200 hidden flex-col max-h-[78dvh] safe-bottom">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/70 rounded-t-3xl">
      <div class="min-w-0 pr-2">
        <div class="flex items-center gap-1.5 text-emerald-700 font-bold text-sm truncate">
          <i data-lucide="navigation" class="w-4 h-4 flex-shrink-0"></i>
          <span id="nav-target-title" class="truncate">前往目的地</span>
        </div>
        <p id="nav-origin-text" class="text-[11px] text-slate-500 truncate mt-0.5">起点：全季酒店(南京老门东店)</p>
      </div>
      <button onclick="closeNavModal()" class="p-1.5 rounded-full bg-slate-200/70 hover:bg-slate-300 text-slate-600">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="px-4 pt-3 flex gap-2">
      <button id="nav-tab-transit" onclick="switchNavMode('transit')" class="flex-1 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm transition">
        <i data-lucide="bus" class="w-3.5 h-3.5"></i> 公共交通 (最快地铁/公交)
      </button>
      <button id="nav-tab-drive" onclick="switchNavMode('drive')" class="flex-1 py-2 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5 transition">
        <i data-lucide="car" class="w-3.5 h-3.5"></i> 打车前往时间
      </button>
    </div>

    <div id="nav-route-details" class="flex-1 overflow-y-auto p-4 space-y-2.5 text-xs"></div>
  </div>

  <!-- ========================================================
       核心 JavaScript 业务逻辑
  ======================================================== -->
  <script>
    // 1. 默认起点固定为：全季酒店(南京夫子庙老门东店) - 秦淮区箍桶巷
    const DEFAULT_HOTEL = {
      lng: 118.78655,
      lat: 32.01352,
      isRealGps: false,
      name: "全季酒店(南京老门东店)"
    };

    let userLocation = { ...DEFAULT_HOTEL };

    // 2. 初始南京热门景点数据（基于从全季老门东店出发的真实地铁/公交时间）
    const DEFAULT_SPOTS = [
      { id: 1, name: "老门东历史文化街区", category: "街区/美食", lng: 118.78795, lat: 32.01215, day: 1, timeNeeded: "2小时", transit: "从全季酒店步行约 3 分钟 (220米) 即达", tip: "就在酒店旁边！推荐蒋有记锅贴、陆氏梅花糕、蓝老大糖粥藕，德云社也在街区内。", cost: "免费" },
      { id: 2, name: "夫子庙与秦淮风光带", category: "文化/夜景", lng: 118.78854, lat: 32.01956, day: 1, timeNeeded: "2小时", transit: "最快约 12 分钟：沿箍桶巷向北步行约 850 米直达 / 或乘公交 23路/46路 (1站)", tip: "傍晚亮灯后最美，文德桥是拍秦淮河画舫的绝佳机位。", cost: "街区免费" },
      { id: 3, name: "钟山风景区·中山陵", category: "名胜古迹", lng: 118.84888, lat: 32.06173, day: 1, timeNeeded: "3小时", transit: "最快约 48 分钟：地铁3号线(武定门上→大行宫换乘, 2站) ➔ 地铁2号线(大行宫→下马坊站, 5站) ➔ 换景区观光车", tip: "需提前在公号预约。392级台阶，登顶可俯瞰南京城林海。", cost: "免费(观光车10元)" },

    // 本地缓存读取（升级缓存 Key 确保干净生效）
    const STORAGE_KEY = 'nanjing_trip_spots_v3';

    function loadSavedSpots() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        } catch(e) { console.error(e); }
      }
      return [...DEFAULT_SPOTS];
    }

    function saveSpotsToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(spots));
    }

    function resetToDefaultSpots() {
      if (confirm("确定恢复为初始推荐的 8 个南京经典打卡点吗？（当前自定义修改将被重置）")) {
        spots = [...DEFAULT_SPOTS];
        saveSpotsToStorage();
        render();
      }
    }

    let spots = loadSavedSpots();
    let currentDayFilter = 'all';
    let map = null, markers = [], polyline = null, currentInfoWindow = null;
    let isAddMode = false;
    let activeNavSpot = null;
    let activeNavMode = 'transit';
    let transferService = null, drivingService = null, autoCompleteService = null, placeSearchService = null, geocoderService = null;
    let isDrawerExpanded = false;
    let pendingSpotDraft = null;

    const DAY_CONFIG = {
      1: { color: "#2563eb", name: "D1 钟山秦淮", badge: "bg-blue-50 text-blue-700 border-blue-200" },
      2: { color: "#16a34a", name: "D2 总统府民国", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
      3: { color: "#d97706", name: "D3 玄武湖风光", badge: "bg-amber-50 text-amber-700 border-amber-200" },
      0: { color: "#64748b", name: "备选打卡", badge: "bg-slate-50 text-slate-600 border-slate-200" }
    };

    // ==========================================
    // 3. 地图与高德服务安全初始化
    // ==========================================
    function initMap() {
      // 无论地图服务状态如何，先把左侧/底部列表渲染出来，绝不白屏！
      renderLists(spots);

      if (typeof AMap === 'undefined') {
        alert("高德地图脚本未加载成功，请检查网络连接");
        return;
      }

      map = new AMap.Map('amap-container', {
        zoom: 13,
        center: [118.795, 32.035],
        viewMode: '2D'
      });

      // 绘制默认酒店起点特殊标记
      renderHotelOriginMarker();

      // 使用 AMap.plugin 确保所有路线规划与搜索插件 100% 加载完毕后再实例化
      AMap.plugin(['AMap.Transfer', 'AMap.Driving', 'AMap.AutoComplete', 'AMap.PlaceSearch', 'AMap.Geocoder', 'AMap.Geolocation'], function() {
        // 默认策略即为 LEAST_TIME（最快捷模式），不传枚举防止未定义报错
        transferService = new AMap.Transfer({ city: '南京市', nightflag: true });
        drivingService = new AMap.Driving({ city: '南京市' });
        autoCompleteService = new AMap.AutoComplete({ city: '南京市', citylimit: true });
        placeSearchService = new AMap.PlaceSearch({ city: '南京市', citylimit: true });
        geocoderService = new AMap.Geocoder({ city: '南京市' });
      });

      map.on('click', function(e) {
        if (!isAddMode) return;
        handleMapPick(e.lnglat.getLng(), e.lnglat.getLat());
      });

      // 点击空白处收起下拉建议框
      document.addEventListener('click', function(e) {
        if (!e.target.closest('#desktop-search-input') && !e.target.closest('#desktop-suggest-list')) {
          document.getElementById('desktop-suggest-list').classList.add('hidden');
        }
        if (!e.target.closest('#mobile-search-input') && !e.target.closest('#mobile-suggest-list')) {
          document.getElementById('mobile-suggest-list').classList.add('hidden');
        }
      });

      render();
    }

    // 在地图上标出“全季酒店(老门东店)”基准起点
    let originMarker = null;
    function renderHotelOriginMarker() {
      if (!map) return;
      if (originMarker) map.remove(originMarker);

      const el = document.createElement('div');
      el.className = 'relative flex items-center justify-center';
      el.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-rose-600 border-2 border-white shadow-lg flex items-center justify-center text-white font-bold text-[11px]">
          起点
        </div>
        <div class="absolute -bottom-5 bg-rose-700 text-white text-[10px] px-1.5 py-0.5 rounded shadow whitespace-nowrap font-medium">
          ${userLocation.name}
        </div>
      `;
      originMarker = new AMap.Marker({
        position: [userLocation.lng, userLocation.lat],
        content: el,
        offset: new AMap.Pixel(-16, -16),
        zIndex: 120
      });
      map.add(originMarker);
    }

    // ==========================================
    // 4. 渲染地图标注、轨迹线与双端列表
    // ==========================================
    function render() {
      const filtered = spots.filter(s => currentDayFilter === 'all' || String(s.day) === String(currentDayFilter));

      // 先更新左右列表
      renderLists(filtered);

      if (!map) return;
      if (markers.length > 0) { map.remove(markers); markers = []; }
      if (polyline) { map.remove(polyline); polyline = null; }

      filtered.forEach(s => {
        const conf = DAY_CONFIG[s.day] || DAY_CONFIG[0];
        const markerEl = document.createElement('div');
        markerEl.className = 'relative flex items-center justify-center cursor-pointer transition transform hover:scale-110';
        markerEl.innerHTML = `
          <div style="background-color: ${conf.color}" class="w-7 h-7 rounded-full shadow-lg border-2 border-white text-white font-bold text-xs flex items-center justify-center">
            ${s.day ? 'D'+s.day : '★'}
          </div>
          <div class="absolute -bottom-4 bg-slate-900/85 text-white text-[10px] px-1.5 py-0.2 rounded shadow whitespace-nowrap pointer-events-none">
            ${s.name.split('·')[0].slice(0, 6)}
          </div>
        `;
        const marker = new AMap.Marker({
          position: [s.lng, s.lat],
          content: markerEl,
          offset: new AMap.Pixel(-14, -14)
        });
        marker.on('click', () => openSpotPopup(s));
        markers.push(marker);
      });
      map.add(markers);

      // 当切换到具体某一天时，绘制从全季酒店出发串联各景点的虚线
      if (currentDayFilter !== 'all' && String(currentDayFilter) !== '0' && filtered.length > 0) {
        const pathCoords = [[userLocation.lng, userLocation.lat], ...filtered.map(s => [s.lng, s.lat])];
        polyline = new AMap.Polyline({
          path: pathCoords,
          strokeColor: DAY_CONFIG[currentDayFilter].color,
          strokeWeight: 4,
          strokeOpacity: 0.85,
          strokeStyle: 'dashed',
          strokeDasharray: [10, 6],
          isOutline: true,
          outlineColor: '#ffffff',
          borderWeight: 1.5
        });
        map.add(polyline);
      }
    }

    function renderLists(filtered) {
      const desktopList = document.getElementById('desktop-spot-list');
      const desktopCount = document.getElementById('desktop-spot-count');
      if (desktopCount) desktopCount.innerText = `当前显示 ${filtered.length} / 共 ${spots.length} 个打卡点`;

      const mobileList = document.getElementById('mobile-spot-list');
      const mobileCount = document.getElementById('mobile-spot-count-text');
      if (mobileCount) mobileCount.innerText = `当前日程共 ${filtered.length} 个打卡点`;

      if (filtered.length === 0) {
        const emptyHtml = `<div class="text-center py-8 text-slate-400 text-xs">该日程下暂无打卡点，可在上方搜索或点击“地图选点”添加</div>`;
        if (desktopList) desktopList.innerHTML = emptyHtml;
        if (mobileList) mobileList.innerHTML = emptyHtml;
        return;
      }

      const itemsHtml = filtered.map(s => {
        const conf = DAY_CONFIG[s.day] || DAY_CONFIG[0];
        return `
          <div class="p-3 bg-white border border-slate-200/90 rounded-2xl shadow-sm hover:border-emerald-400 transition cursor-pointer" onclick="focusSpot(${s.id})">
            <div class="flex items-start justify-between gap-2 mb-1.5">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-xs text-slate-900 truncate">${s.name}</span>
                  <span class="text-[10px] px-1.5 py-0.2 rounded border ${conf.badge} font-semibold flex-shrink-0">${conf.name}</span>
                </div>
                <p class="text-[11px] text-slate-500 line-clamp-1 mt-1">💡 ${s.tip}</p>
              </div>
              <button onclick="event.stopPropagation(); startNavigationTo(${s.id})" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-xl text-xs font-semibold flex items-center gap-1 flex-shrink-0 shadow-sm">
                <i data-lucide="navigation" class="w-3 h-3"></i> 路线
              </button>
            </div>
            <div class="text-[11px] text-blue-700 bg-blue-50/70 px-2 py-1 rounded-lg truncate">
              🚇 ${s.transit || '点击路线查看实时换乘'}
            </div>
          </div>
        `;
      }).join('');

      if (desktopList) desktopList.innerHTML = itemsHtml;
      if (mobileList) mobileList.innerHTML = itemsHtml;
      lucide.createIcons();
    }

    // 地图弹窗卡片
    function openSpotPopup(spot) {
      if (currentInfoWindow) currentInfoWindow.close();
      const conf = DAY_CONFIG[spot.day] || DAY_CONFIG[0];

      const content = `
        <div class="w-72 bg-white p-3.5 text-xs">
          <div class="flex items-start justify-between mb-1.5">
            <div class="pr-2">
              <h4 class="font-bold text-slate-900 text-sm leading-tight">${spot.name}</h4>
              <span class="text-[10px] text-slate-400">${spot.category} · 耗时: ${spot.timeNeeded} · 门票: ${spot.cost}</span>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded border ${conf.badge} flex-shrink-0">${conf.name}</span>
          </div>

          <div class="text-slate-700 bg-amber-50/80 p-2 rounded-xl text-[11px] mb-2 leading-relaxed border border-amber-100">
            <b>💡 攻略：</b>${spot.tip}
          </div>

          <div class="text-blue-800 bg-blue-50/80 p-2 rounded-xl text-[11px] mb-2.5 leading-relaxed border border-blue-100">

          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-100 gap-2">
            <select onchange="updateSpotDay(${spot.id}, this.value)" class="text-[11px] bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 font-medium">
              <option value="1" ${spot.day==1?'selected':''}>排到 Day 1</option>
              <option value="2" ${spot.day==2?'selected':''}>排到 Day 2</option>
              <option value="3" ${spot.day==3?'selected':''}>排到 Day 3</option>
              <option value="0" ${spot.day==0?'selected':''}>移入备选</option>
            </select>
            <div class="flex gap-1.5">
              <button onclick="deleteSpot(${spot.id})" class="text-rose-500 hover:bg-rose-50 rounded-lg text-[11px] px-2 py-1">删除</button>
              <button onclick="startNavigationTo(${spot.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-lg text-[11px] font-semibold flex items-center gap-1 shadow-sm">
                <i data-lucide="navigation" class="w-3 h-3"></i> 实时路线

      `;

      currentInfoWindow = new AMap.InfoWindow({
        content: content,
        offset: new AMap.Pixel(0, -18)
      });
      currentInfoWindow.open(map, [spot.lng, spot.lat]);
      setTimeout(() => lucide.createIcons(), 50);
    }

    // ==========================================
    // 5. 核心功能：从起点自动测算最短时间公交/地铁文本
    // ==========================================
    function formatBestTransitSummary(plan) {
      const totalMin = Math.max(1, Math.round(plan.time / 60));
      const segmentsDesc = [];

      if (plan.segments && plan.segments.length > 0) {
        plan.segments.forEach(seg => {
          if ((seg.transit_mode === 'SUBWAY' || seg.transit_mode === 'BUS') && seg.transit && seg.transit.lines && seg.transit.lines[0]) {
            const line = seg.transit.lines[0];
            const cleanLineName = line.name.split('(')[0];
            const segMin = line.stime ? Math.round(line.stime / 60) : Math.max(3, line.via_num * 3);
            segmentsDesc.push(`${cleanLineName} (${line.departure_stop.name}→${line.arrival_stop.name}, ${line.via_num}站/约${segMin}分)`);
          }
        });
      }

      if (segmentsDesc.length > 0) {
        return `最快约 ${totalMin} 分钟：乘 ${segmentsDesc.join(' ➔ 换乘 ')}，总步行 ${plan.walking_distance} 米`;
      } else {
        return `距离较近，从起点直接步行约 ${plan.walking_distance} 米 (约 ${totalMin} 分钟)`;
      }
    }

    // ==========================================
    // 6. 搜索地点模糊下拉（含详细地址 + 右侧添加按钮）
    // ==========================================
    let searchTimer = null;
    let cachedPois = [];

    function handleSearchInput(keyword, listContainerId) {
      const container = document.getElementById(listContainerId);
      const text = keyword.trim();
      if (!text) {
        container.classList.add('hidden');
        return;
      }

      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        if (!placeSearchService) return;
        // 使用 PlaceSearch 获取带精确经纬度与详细地址的 POI 列表
        placeSearchService.search(text, function(status, result) {
          if (status === 'complete' && result.poiList && result.poiList.pois && result.poiList.pois.length > 0) {
            cachedPois = result.poiList.pois;
            container.innerHTML = cachedPois.map((poi, idx) => {
              const fullAddress = `${poi.adname || ''}${poi.address || '南京市'}`;
              return `
                <div class="p-2 hover:bg-slate-50 rounded-xl flex items-center justify-between gap-2 border-b border-slate-100 last:border-none transition">
                  <div class="min-w-0 flex-1 cursor-pointer" onclick="previewSearchLocation(${idx})">
                    <div class="font-bold text-xs text-slate-900 truncate">${poi.name}</div>
                    <div class="text-[11px] text-slate-500 truncate mt-0.5">📍 ${fullAddress}</div>
                  </div>
                  <button onclick="openAddModalByPoiIndex(${idx})" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-xl text-xs font-semibold flex-shrink-0 flex items-center gap-1 shadow-sm">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> 添加
                  </button>
                </div>
              `;
            }).join('');
            container.classList.remove('hidden');
            lucide.createIcons();
          } else {
            container.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">未找到匹配的南京地点，请换个关键词</div>`;
            container.classList.remove('hidden');
          }
        });
      }, 250);
    }

    function previewSearchLocation(idx) {
      const poi = cachedPois[idx];
      if (!poi || !poi.location) return;
      map.setZoomAndCenter(16, [poi.location.lng, poi.location.lat]);
      document.getElementById('desktop-suggest-list').classList.add('hidden');
      document.getElementById('mobile-suggest-list').classList.add('hidden');
    }

    function openAddModalByPoiIndex(idx) {
      const poi = cachedPois[idx];
      if (!poi || !poi.location) return;

      document.getElementById('desktop-suggest-list').classList.add('hidden');
      document.getElementById('mobile-suggest-list').classList.add('hidden');

      const fullAddress = `${poi.adname || ''}${poi.address || ''}`;
      triggerAddSpotModal({
        name: poi.name,
        lng: poi.location.lng,
        lat: poi.location.lat,
        address: fullAddress || "南京市",
        category: poi.type ? poi.type.split(';')[0] : "景点打卡"
      });
    }

    // 打开添加打卡点弹窗，并实时测算从起点出发的最短公共交通路线
    function triggerAddSpotModal(draft) {
      pendingSpotDraft = draft;

      document.getElementById('form-spot-name').value = draft.name;
      document.getElementById('form-subtitle').innerText = `详细地址：${draft.address}`;
      document.getElementById('form-spot-day').value = (currentDayFilter === 'all' || String(currentDayFilter) === '0') ? '1' : String(currentDayFilter);
      document.getElementById('form-spot-time').value = "1.5-2小时";
      document.getElementById('form-spot-cost').value = "免费";
      document.getElementById('form-spot-cat').value = draft.category;
      document.getElementById('form-spot-tip').value = `地址位于${draft.address}，推荐打卡。`;
      
      const transitInput = document.getElementById('form-spot-transit');
      const transitHint = document.getElementById('form-transit-hint');
      transitInput.value = "正在从起点测算最短时间的地铁/公交方案...";
      transitHint.innerText = `当前测算起点：${userLocation.name} (按最短耗时优选)`;

      document.getElementById('custom-add-modal').classList.remove('hidden');
      lucide.createIcons();

      // 立即调用高德公交规划，按最短时间选出最优方案填入
      if (transferService) {
        transferService.search([userLocation.lng, userLocation.lat], [draft.lng, draft.lat], function(status, res) {
          if (status === 'complete' && res.plans && res.plans.length > 0) {
            // 按时间升序排序，确保绝对取最短耗时方案
            const sortedPlans = [...res.plans].sort((a, b) => a.time - b.time);
            const bestPlan = sortedPlans[0];
            transitInput.value = formatBestTransitSummary(bestPlan);
          } else {
            transitInput.value = `距起点较近，建议直接步行或打车前往 (${draft.address})`;
          }
        });
      } else {
        transitInput.value = `建议乘地铁或打车前往 (${draft.address})`;
      }
    }

    function closeAddSpotModal() {
      document.getElementById('custom-add-modal').classList.add('hidden');
      pendingSpotDraft = null;
    }

    function submitSaveNewSpot() {
      if (!pendingSpotDraft) return;
      const name = document.getElementById('form-spot-name').value.trim();
      if (!name) {
        alert("请填写打卡点名称！");
        return;
      }

      const newSpot = {
        id: Date.now(),
        name: name,
        category: document.getElementById('form-spot-cat').value.trim() || "景点打卡",
        lng: pendingSpotDraft.lng,
        lat: pendingSpotDraft.lat,
        day: parseInt(document.getElementById('form-spot-day').value),
        timeNeeded: document.getElementById('form-spot-time').value.trim() || "1.5小时",
        transit: document.getElementById('form-spot-transit').value.trim() || "自行前往",
        tip: document.getElementById('form-spot-tip').value.trim() || "推荐打卡",
        cost: document.getElementById('form-spot-cost').value.trim() || "免费"
      };

      spots.push(newSpot);
      saveSpotsToStorage();
      closeAddSpotModal();
      render();
      focusSpot(newSpot.id);
    }

    // 地图直接点击选点
    function handleMapPick(lng, lat) {
      toggleAddMode();
      if (geocoderService) {
        geocoderService.getAddress([lng, lat], function(status, result) {
          let addr = "南京市地图选点";
          let poiName = "自定义打卡点";
          if (status === 'complete' && result.regeocode) {
            addr = result.regeocode.formattedAddress;
            if (result.regeocode.aois && result.regeocode.aois[0]) {
              poiName = result.regeocode.aois[0].name;
            }
          }
          triggerAddSpotModal({
            name: poiName,
            lng: lng,
            lat: lat,
            address: addr,
            category: "自定义打卡"
          });
        });
      } else {
        triggerAddSpotModal({
          name: "自定义打卡点",
          lng: lng,
          lat: lat,
          address: `坐标: ${lng.toFixed(4)}, ${lat.toFixed(4)}`,
          category: "自定义打卡"
        });
      }
    }

    // ==========================================
    // 7. 路线导航弹窗（展示详细地铁/公交几号线、各自耗时、打车时间）
    // ==========================================
    function startNavigationTo(spotId) {
      if (currentInfoWindow) currentInfoWindow.close();
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;
      activeNavSpot = spot;

      document.getElementById('nav-target-title').innerText = `前往 【${spot.name}】`;
      document.getElementById('nav-origin-text').innerText = `起点：${userLocation.name}`;
      
      const modal = document.getElementById('nav-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      calcAndRenderRoute();
    }

    function closeNavModal() {
      const modal = document.getElementById('nav-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function switchNavMode(mode) {
      activeNavMode = mode;
      const btnT = document.getElementById('nav-tab-transit');
      const btnD = document.getElementById('nav-tab-drive');
      if (mode === 'transit') {
        btnT.className = "flex-1 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm transition";
        btnD.className = "flex-1 py-2 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5 transition";
      } else {
        btnD.className = "flex-1 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm transition";
        btnT.className = "flex-1 py-2 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5 transition";
      }
      calcAndRenderRoute();
    }

    function calcAndRenderRoute() {
      const container = document.getElementById('nav-route-details');
      container.innerHTML = `
        <div class="text-center py-8 space-y-2 text-slate-400">
          <div class="inline-block w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-xs">正在从【${userLocation.name}】计算最快路线...</p>
        </div>
      `;

      const start = [userLocation.lng, userLocation.lat];
      const end = [activeNavSpot.lng, activeNavSpot.lat];
      const directAmapUrl = `https://uri.amap.com/navigation?from=${start[0]},${start[1]},${encodeURIComponent(userLocation.name)}&to=${end[0]},${end[1]},${encodeURIComponent(activeNavSpot.name)}&mode=${activeNavMode === 'transit' ? 'bus' : 'car'}`;

      if (activeNavMode === 'transit') {
        if (!transferService) {
          container.innerHTML = `<div class="p-4 text-center text-slate-500">公交服务初始化中，请稍后重试</div>`;
          return;
        }

        transferService.search(start, end, function(status, result) {
          if (status === 'complete' && result.plans && result.plans.length > 0) {
            // 按最短时间排序
            const sortedPlans = [...result.plans].sort((a, b) => a.time - b.time);
            const plan = sortedPlans[0];
            const totalMin = Math.max(1, Math.round(plan.time / 60));
            const walkM = plan.walking_distance;

            let stepsHtml = '';
            plan.segments.forEach((seg) => {
              if ((seg.transit_mode === 'SUBWAY' || seg.transit_mode === 'BUS') && seg.transit && seg.transit.lines && seg.transit.lines[0]) {
                const line = seg.transit.lines[0];
                const isSubway = seg.transit_mode === 'SUBWAY';
                const segMin = line.stime ? Math.round(line.stime / 60) : Math.max(3, line.via_num * 3);
                stepsHtml += `
                  <div class="p-3 ${isSubway ? 'bg-blue-50 border-blue-200' : 'bg-emerald-50 border-emerald-200'} border rounded-2xl flex items-start justify-between gap-2">
                    <div class="flex items-start gap-2.5">
                      <span class="px-2 py-0.5 rounded-lg ${isSubway ? 'bg-blue-600' : 'bg-emerald-600'} text-white font-bold text-[10px] flex-shrink-0 mt-0.5">
                        ${isSubway ? '地铁' : '公交'}
                      </span>
                      <div>
                        <p class="font-bold text-slate-900 text-xs">${line.name}</p>
                        <p class="text-[11px] text-slate-600 mt-0.5"><b>${line.departure_stop.name}</b> 上车 ➔ <b>${line.arrival_stop.name}</b> 下车</p>
                      </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                      <span class="text-xs font-bold ${isSubway ? 'text-blue-700' : 'text-emerald-700'}">约 ${segMin} 分钟</span>
                      <p class="text-[10px] text-slate-400">途经 ${line.via_num} 站</p>
                    </div>
                  </div>
                `;
              } else if (seg.transit_mode === 'WALK' && seg.distance > 0) {
                const walkMin = Math.max(1, Math.round((seg.time || seg.distance / 1.2) / 60));
                stepsHtml += `
                  <div class="px-3 py-1.5 bg-slate-50 rounded-xl text-[11px] text-slate-500 flex items-center justify-between">
                    <span>🚶 ${seg.instruction || `步行 ${seg.distance} 米`}</span>
                    <span class="font-medium text-slate-600">约 ${walkMin} 分钟</span>
                  </div>
                `;
              }
            });

            container.innerHTML = `
              <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-2xl flex justify-between items-center">
                <div>
                  <span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded-md font-bold mr-1.5">最快方案</span>
                  <span class="text-sm font-bold text-emerald-900">全程约 ${totalMin} 分钟</span>
                </div>
                <span class="text-[11px] text-emerald-700 font-medium">票价约 ¥${plan.cost || 2} · 总步行 ${walkM}米</span>
              </div>
              <div class="space-y-2 my-2">${stepsHtml}</div>
              <a href="${directAmapUrl}" target="_blank" class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-center font-bold text-xs shadow-md transition">
                唤起高德地图 App 实时导航 ↗
              </a>
            `;
          } else {
            // 距离极近无需坐车（如全季酒店老门东店到老门东景区）
            container.innerHTML = `
              <div class="p-4 bg-blue-50 border border-blue-200 rounded-2xl text-center space-y-1.5 mb-3">
                <p class="font-bold text-blue-900 text-sm">距离起点非常近，步行即可到达！</p>
                <p class="text-xs text-slate-600">${activeNavSpot.transit}</p>
              </div>
              <a href="${directAmapUrl}" target="_blank" class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-center font-bold text-xs shadow-md transition">
                打开高德地图查看步行引导 ↗
              </a>
            `;
          }
          lucide.createIcons();
        });
      } else {
        // 打车 / 自驾耗时计算
        drivingService.search(start, end, function(status, result) {
          if (status === 'complete' && result.routes && result.routes.length > 0) {
            const route = result.routes[0];
            const durationMin = Math.max(3, Math.round(route.time / 60));
            const distKm = (route.distance / 1000).toFixed(1);
            const taxiCost = Math.round(11 + (distKm > 3 ? (distKm - 3) * 2.6 : 0));

            container.innerHTML = `
              <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl space-y-2 mb-3">
                <div class="flex justify-between items-center">
                  <span class="text-base font-bold text-slate-900">🚕 打车预计 ${durationMin} 分钟</span>
                  <span class="text-sm font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-lg">预估车费 ¥${taxiCost}</span>
                </div>
                <p class="text-xs text-slate-600">起点：${userLocation.name} ➔ 终点：${activeNavSpot.name}</p>
                <p class="text-[11px] text-slate-500">全程距离约 ${distKm} 公里 · 途经 ${route.steps.length} 个主要道路节点</p>
              </div>
              <a href="${directAmapUrl}" target="_blank" class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-center font-bold text-xs shadow-md transition">
                唤起高德地图 App 一键打车/导航 ↗
              </a>
            `;
          } else {
            container.innerHTML = `<div class="p-4 text-center text-slate-500">距离过近，建议直接步行前往</div>`;
          }
        });
      }
    }

    // ==========================================
    // 8. 日程切换、GPS 定位与基础操作
    // ==========================================
    function filterDay(day) {
      currentDayFilter = day;
      document.querySelectorAll('.day-filter-btn').forEach(btn => {
        if (String(btn.dataset.day) === String(day)) {
          btn.className = "day-filter-btn flex-1 md:flex-initial flex-shrink-0 px-3 py-1.5 text-xs rounded-full md:rounded-lg font-semibold bg-emerald-600 text-white shadow-md transition";
        } else {
          btn.className = "day-filter-btn flex-1 md:flex-initial flex-shrink-0 px-3 py-1.5 text-xs rounded-full md:rounded-lg font-medium bg-white text-slate-700 border border-slate-200/80 hover:bg-slate-100 transition";
        }
      });
      render();
    }

    function focusSpot(id) {
      const spot = spots.find(s => s.id === id);
      if (spot && map) {
        map.setZoomAndCenter(15, [spot.lng, spot.lat]);
        openSpotPopup(spot);
      }
    }

    function updateSpotDay(spotId, day) {
      const spot = spots.find(s => s.id === spotId);
      if (spot) {
        spot.day = parseInt(day);
        saveSpotsToStorage();
        render();
        openSpotPopup(spot);
      }
    }

    function deleteSpot(spotId) {
      if (confirm("确定从行程中删除该打卡点吗？")) {
        spots = spots.filter(s => s.id !== spotId);
        saveSpotsToStorage();
        if (currentInfoWindow) currentInfoWindow.close();
        render();
      }
    }

    function toggleAddMode() {
      isAddMode = !isAddMode;
      const toast = document.getElementById('add-mode-toast');
      const mobileBtn = document.getElementById('mobile-add-mode-btn');
      const desktopBtn = document.getElementById('desktop-add-mode-btn');

      if (isAddMode) {
        toast.classList.remove('hidden');
        if (mobileBtn) { mobileBtn.classList.add('bg-emerald-600', 'text-white'); mobileBtn.classList.remove('bg-white', 'text-emerald-600'); }
        if (desktopBtn) { desktopBtn.classList.add('bg-emerald-600', 'text-white'); desktopBtn.classList.remove('bg-slate-50', 'text-emerald-600'); }
      } else {
        toast.classList.add('hidden');
        if (mobileBtn) { mobileBtn.classList.remove('bg-emerald-600', 'text-white'); mobileBtn.classList.add('bg-white', 'text-emerald-600'); }
        if (desktopBtn) { desktopBtn.classList.remove('bg-emerald-600', 'text-white'); desktopBtn.classList.add('bg-slate-50', 'text-emerald-600'); }
      }
    }

    function getUserLocation() {
      const mobileStatus = document.getElementById('mobile-gps-status-text');
      const desktopStatus = document.getElementById('desktop-gps-status-text');
      if (mobileStatus) mobileStatus.innerText = "正在获取实时 GPS 定位...";
      if (desktopStatus) desktopStatus.innerText = "正在获取实时 GPS 定位...";

      AMap.plugin('AMap.Geolocation', function() {
        const geolocation = new AMap.Geolocation({
          enableHighAccuracy: true,
          timeout: 6000,
          needAddress: true
        });

        geolocation.getCurrentPosition(function(status, result) {
          if (status === 'complete' && result.position) {
            userLocation = {
              lng: result.position.lng,
              lat: result.position.lat,
              isRealGps: true,
              name: result.formattedAddress ? result.formattedAddress.replace('江苏省南京市', '') : "我的实时位置"
            };
            const text = `实时起点：${userLocation.name}`;
            if (mobileStatus) mobileStatus.innerText = text;
            if (desktopStatus) desktopStatus.innerText = text;
            renderHotelOriginMarker();
            map.setCenter([userLocation.lng, userLocation.lat]);
          } else {
            userLocation = { ...DEFAULT_HOTEL };
            const fallbackText = `未授权定位，默认起点：${DEFAULT_HOTEL.name}`;
            if (mobileStatus) mobileStatus.innerText = fallbackText;
            if (desktopStatus) desktopStatus.innerText = fallbackText;
            renderHotelOriginMarker();
            map.setCenter([DEFAULT_HOTEL.lng, DEFAULT_HOTEL.lat]);
          }
        });
      });
    }

    function toggleDrawerHeight() {
      const drawer = document.getElementById('bottom-drawer');
      const tip = document.getElementById('drawer-toggle-tip');
      const icon = document.getElementById('drawer-toggle-icon');
      isDrawerExpanded = !isDrawerExpanded;

      if (isDrawerExpanded) {
        drawer.style.height = '65dvh';
        tip.innerText = "下滑收起";
        icon.setAttribute('data-lucide', 'chevron-down');
      } else {
        drawer.style.height = '230px';
        tip.innerText = "上滑展开列表";
        icon.setAttribute('data-lucide', 'chevron-up');
      }
      lucide.createIcons();
    }

    function exportCurrentSpotsToCode() {
      const code = JSON.stringify(spots, null, 2);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => {
          alert("✅ 最新定稿数据已复制到剪贴板！\n\n前往 GitHub 仓库编辑 index.html，替换 DEFAULT_SPOTS 数组即可同步给伴侣。");
        }).catch(() => {
          prompt("请复制下方定稿数据：", code);
        });
      } else {
        prompt("请复制下方定稿数据：", code);
      }
    }

    window.onload = () => {
      initMap();
      lucide.createIcons();
    };
  </script>
</body>
</html>
