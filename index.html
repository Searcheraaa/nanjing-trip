<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>南京旅游攻略打卡地图</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 引入 SortableJS 实现手机/电脑丝滑上下拖拽排序 -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- 1. 高德地图安全密钥配置 -->
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: "514a23571b3ffbf7725fb77dc7ddcca7", 
    };
  </script>
  <!-- 2. 加载高德地图 JS API 2.0 -->
  <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=265a60ea1a814174cc37ffee8c260055&plugin=AMap.ToolBar,AMap.Scale,AMap.Geolocation,AMap.Transfer,AMap.Driving,AMap.PlaceSearch,AMap.AutoComplete,AMap.Geocoder"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(10px, env(safe-area-inset-top)); }
    .amap-info-content { padding: 0 !important; border-radius: 14px !important; overflow: hidden; }
    .sortable-ghost { opacity: 0.4; background-color: #ecfdf5 !important; border: 2px dashed #10b981 !important; }
    .drag-handle { touch-action: none; cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased overflow-hidden h-[100dvh] w-screen flex flex-col md:flex-row relative select-none">

  <!-- 手机端搜索专注遮罩层（彻底解决键盘弹出时与底层元素重叠问题） -->
  <div id="mobile-search-backdrop" onclick="closeMobileSearchFocus()" class="md:hidden fixed inset-0 bg-slate-900/50 backdrop-blur-[2px] z-30 hidden transition-opacity"></div>

  <!-- ========================================================
       【电脑端 UI】左侧工作台侧边栏 (md:flex)
  ======================================================== -->
  <aside id="desktop-sidebar" class="hidden md:flex md:w-96 h-full bg-white border-r border-slate-200 z-20 flex-col shadow-xl transition-all duration-300">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
      <div>
        <h1 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="map-pin" class="w-5 h-5 text-emerald-600"></i>
          南京行程规划助手
        </h1>
        <p id="desktop-gps-status-text" class="text-[11px] text-emerald-700 font-medium mt-0.5">默认起点：全季酒店(老门东店)</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="resetToDefaultSpots()" title="恢复初始推荐景点" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>
        <button onclick="exportCurrentSpotsToCode()" title="导出代码同步到GitHub" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-900 text-white text-xs font-semibold rounded-xl flex items-center gap-1 shadow transition">
          <i data-lucide="share" class="w-3.5 h-3.5"></i>
          <span>导出配置</span>
        </button>
      </div>
    </div>

    <!-- 电脑端搜索框与模糊推荐容器 -->
    <div class="p-3 border-b border-slate-100 space-y-2 relative">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5 pointer-events-none"></i>
        <input 
          id="desktop-search-input" 
          type="text" 
          placeholder="输入南京地点(如: 鸡鸣寺、科巷、朝天宫)..." 
          autocomplete="off"
          class="w-full pl-8 pr-7 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 transition"
          oninput="handleSearchInput(this.value, 'desktop-suggest-list')"
          onfocus="handleSearchInput(this.value, 'desktop-suggest-list')"
        />
        <button onclick="document.getElementById('desktop-search-input').value=''; document.getElementById('desktop-suggest-list').classList.add('hidden');" class="absolute right-2 top-2 text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
        <!-- 模糊搜索下拉推荐面板 -->
        <div id="desktop-suggest-list" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-2xl shadow-2xl z-50 max-h-80 overflow-y-auto p-1.5 space-y-1"></div>
      </div>

      <div class="flex items-center justify-between gap-2">
        <button id="desktop-add-mode-btn" onclick="toggleAddMode()" class="flex-1 py-1.5 bg-slate-50 border border-emerald-500 text-emerald-600 text-xs font-medium rounded-xl flex items-center justify-center gap-1 hover:bg-emerald-50 transition">
          <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
          <span>地图选点</span>
        </button>
        <button onclick="getUserLocation()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 text-slate-600 text-xs rounded-xl flex items-center gap-1 hover:bg-slate-100 transition">
          <i data-lucide="locate-fixed" class="w-3.5 h-3.5 text-emerald-600"></i>
          <span>刷新实时定位</span>
        </button>
      </div>
    </div>

    <!-- 电脑端动态日程过滤栏 (支持添加天数 & 自定义名称) -->
    <div id="desktop-day-tabs" class="p-2 border-b border-slate-100 flex items-center gap-1 bg-slate-50/70 overflow-x-auto no-scrollbar"></div>

    <!-- 电脑端景点打卡列表容器 (支持上下拖拽排序) -->
    <div id="desktop-spot-list" class="flex-1 overflow-y-auto p-3 space-y-2.5"></div>

    <div class="p-3 bg-slate-50 border-t border-slate-100 text-[11px] text-slate-500 flex justify-between items-center">
      <span id="desktop-spot-count">共 0 个打卡点</span>
      <span class="text-emerald-600">按住左侧 ⠿ 可上下拖动排序</span>
    </div>
  </aside>

  <!-- ========================================================
       【手机端 UI】顶部悬浮流 (md:hidden)
  ======================================================== -->
  <header class="md:hidden absolute top-0 left-0 right-0 z-40 pointer-events-none safe-top px-3">
    <div class="flex flex-col gap-2 max-w-md mx-auto">
      
      <!-- 第一层：搜索框 + 选点 + 定位 + 导出 -->
      <div class="relative pointer-events-auto bg-white rounded-2xl shadow-lg border border-slate-200 p-1.5 flex items-center gap-1.5">
        <div class="relative flex-1 flex items-center min-w-0">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 pointer-events-none"></i>
          <input 
            id="mobile-search-input" 
            type="text" 
            placeholder="搜南京地点(如:鸡鸣寺、科巷)..." 
            autocomplete="off"
            class="w-full pl-8 pr-6 py-1.5 text-xs bg-slate-50 border border-slate-200/80 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 transition"
            oninput="handleSearchInput(this.value, 'mobile-suggest-list')"
            onfocus="openMobileSearchFocus(); handleSearchInput(this.value, 'mobile-suggest-list')"
          />
          <button id="mobile-search-clear-btn" onclick="clearMobileSearch()" class="hidden absolute right-1.5 p-0.5 text-slate-400 hover:text-slate-600">
            <i data-lucide="x-circle" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <button id="mobile-add-mode-btn" onclick="toggleAddMode()" class="px-2 py-1.5 bg-white border border-emerald-500 text-emerald-600 text-xs font-medium rounded-xl flex items-center gap-1 flex-shrink-0">
          <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
          <span>选点</span>
        </button>

        <button onclick="getUserLocation()" title="当前定位" class="p-1.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 active:bg-slate-100 flex-shrink-0">
          <i data-lucide="locate-fixed" class="w-4 h-4 text-emerald-600"></i>
        </button>

        <button onclick="exportCurrentSpotsToCode()" title="复制数据" class="px-2 py-1.5 bg-slate-800 text-white text-xs font-semibold rounded-xl flex items-center gap-1 flex-shrink-0 shadow">
          <i data-lucide="share" class="w-3 h-3"></i>
          <span>导出</span>
        </button>

        <!-- 手机端模糊推荐下拉面板（纯白不透明底色 + 独立滚动最大高度 42dvh，杜绝与键盘或底层重叠） -->
        <div id="mobile-suggest-list" class="hidden absolute top-full left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-2xl z-50 max-h-[42dvh] overflow-y-auto p-1.5 space-y-1"></div>
      </div>

      <!-- 第二层：手机端动态日程横向滑动栏（搜索聚焦时自动隐藏防重叠） -->
      <div id="mobile-day-tabs" class="pointer-events-auto flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 px-0.5 transition-opacity"></div>

      <!-- 第三层：定位状态（搜索聚焦时自动隐藏防重叠） -->
      <div id="mobile-gps-badge-wrap" class="pointer-events-auto self-start transition-opacity">
        <div class="bg-slate-900/85 backdrop-blur-sm text-white text-[11px] px-2.5 py-1 rounded-full shadow flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="mobile-gps-status-text">默认起点：全季酒店(老门东店)</span>
        </div>
      </div>

    </div>
  </header>

  <!-- ========================================================
       地图容器主体
  ======================================================== -->
  <main class="flex-1 h-full w-full relative">
    <div id="amap-container" class="w-full h-full"></div>

    <div id="add-mode-toast" class="hidden absolute top-28 md:top-6 left-1/2 -translate-x-1/2 z-30 bg-slate-900/95 text-white text-xs px-4 py-2 rounded-full shadow-lg flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      在地图任意位置轻点，即可新增打卡点并定制路线
      <button onclick="toggleAddMode()" class="ml-2 underline text-emerald-300">取消</button>
    </div>
  </main>

  <!-- ========================================================
       【手机端 UI】底部抽屉 (md:hidden)
  ======================================================== -->
  <div id="bottom-drawer" class="md:hidden fixed left-0 right-0 bottom-0 z-20 bg-white/95 backdrop-blur-md rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.15)] border-t border-slate-200 transition-all duration-300 flex flex-col max-h-[75dvh] h-[230px]">
    <div onclick="toggleDrawerHeight()" class="pt-2 pb-1.5 flex flex-col items-center cursor-pointer">
      <div class="w-10 h-1 bg-slate-300 rounded-full mb-1.5"></div>
      <div class="flex items-center justify-between w-full px-5 text-xs text-slate-500 font-medium">
        <span id="mobile-spot-count-text">共 0 个打卡点</span>
        <span class="text-emerald-600 flex items-center gap-0.5">
          <span id="drawer-toggle-tip">按住 ⠿ 可拖动排序 · 上滑展开</span>
          <i id="drawer-toggle-icon" data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
        </span>
      </div>
    </div>

    <div id="mobile-spot-list" class="flex-1 overflow-y-auto px-4 py-2 space-y-2 safe-bottom"></div>
  </div>

  <!-- ========================================================
       自定义添加 / 编辑打卡点弹窗 (支持新增与已添加打卡点再次 DIY 编辑)
  ======================================================== -->
  <div id="custom-add-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-5 space-y-3.5 transform transition-all border border-slate-100 max-h-[90dvh] overflow-y-auto">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div class="min-w-0 pr-2">
          <h3 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
            <i data-lucide="edit-3" class="w-5 h-5 text-emerald-600 flex-shrink-0"></i>
            <span id="modal-form-title">添加打卡点到行程</span>
          </h3>
          <p id="form-subtitle" class="text-[11px] text-slate-400 truncate mt-0.5">详细地址</p>
        </div>
        <button onclick="closeAddSpotModal()" class="p-1.5 rounded-full text-slate-400 hover:bg-slate-100">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">打卡点名称</label>
          <input id="form-spot-name" type="text" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 font-medium" />
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">安排到哪一天</label>
            <select id="form-spot-day" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 font-medium text-emerald-700"></select>
          </div>
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">预计游玩时长</label>
            <input id="form-spot-time" type="text" value="1.5-2小时" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>

        <!-- 推荐公共交通：保存后将 1:1 同步更新路线详情弹窗中的分步换乘卡片 -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-semibold text-slate-700 flex items-center gap-1">
              <span>公共交通路线方案 (支持自定义填写同步)</span>
            </label>
            <div class="flex items-center gap-2">
              <button type="button" onclick="recalcDefaultTransitInModal()" class="text-[11px] text-emerald-600 hover:underline">
                自动推荐
              </button>
              <button type="button" onclick="document.getElementById('form-spot-transit').value=''; document.getElementById('form-spot-transit').focus();" class="text-[11px] text-rose-500 hover:underline">
                清空自己填
              </button>
            </div>
          </div>
          <textarea id="form-spot-transit" rows="2" placeholder="如：乘 地铁3号线(武定门站➔夫子庙站, 1站/约3分) ➔ 换乘 地铁5号线(➔朝天宫站, 2站/约6分)，步行约 500米" class="w-full px-3 py-2 bg-blue-50/50 border border-blue-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 text-slate-800 leading-relaxed font-medium"></textarea>
          <p id="form-transit-hint" class="text-[10px] text-emerald-600 mt-1">✓ 修改此处文字后，行程的【路线】分步换乘卡片将自动按你填写的方案同步更新</p>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">攻略简短信息 & 避坑备注</label>
          <textarea id="form-spot-tip" rows="2" placeholder="填写必拍机位、预约提醒、必吃美食等..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 leading-relaxed"></textarea>
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">门票/人均费用</label>
            <input id="form-spot-cost" type="text" value="免费" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">分类标签</label>
            <input id="form-spot-cat" type="text" value="景点打卡" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="closeAddSpotModal()" class="flex-1 py-2.5 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">取消</button>
        <button onclick="submitSaveSpot()" class="flex-1 py-2.5 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md transition">保存攻略配置</button>
      </div>
    </div>
  </div>

  <!-- ========================================================
       路线导航弹窗 (100% 同步展示你填写的准确路线方案与拆解步骤)
  ======================================================== -->
  <div id="nav-modal" class="fixed inset-x-0 bottom-0 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-[480px] z-40 bg-white rounded-t-3xl md:rounded-3xl shadow-2xl border border-slate-200 hidden flex-col max-h-[82dvh] safe-bottom">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/70 rounded-t-3xl">
      <div class="min-w-0 pr-2">
        <div class="flex items-center gap-1.5 text-emerald-700 font-bold text-sm truncate">
          <i data-lucide="navigation" class="w-4 h-4 flex-shrink-0"></i>
          <span id="nav-target-title" class="truncate">前往目的地</span>
        </div>
        <p id="nav-origin-text" class="text-[11px] text-slate-500 truncate mt-0.5">起点：全季酒店(南京老门东店)</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="editCurrentNavSpot()" class="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-lg text-xs font-semibold flex items-center gap-1">
          <i data-lucide="edit-2" class="w-3 h-3"></i> 修改路线
        </button>
        <button onclick="closeNavModal()" class="p-1.5 rounded-full bg-slate-200/70 hover:bg-slate-300 text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <div class="px-4 pt-3 flex gap-2">
      <button id="nav-tab-transit" onclick="switchNavMode('transit')" class="flex-1 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm transition">
        <i data-lucide="bus" class="w-3.5 h-3.5"></i> 公共交通 (地铁/公交)
      </button>
      <button id="nav-tab-drive" onclick="switchNavMode('drive')" class="flex-1 py-2 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5 transition">
        <i data-lucide="car" class="w-3.5 h-3.5"></i> 打车前往时间
      </button>
    </div>

    <div id="nav-route-details" class="flex-1 overflow-y-auto p-4 space-y-2.5 text-xs"></div>
  </div>

  <!-- ========================================================
       核心 JavaScript 业务逻辑
  ======================================================== -->
  <script>
    // 1. 默认起点固定为：全季酒店(南京夫子庙老门东店)
    const DEFAULT_HOTEL = {
      lng: 118.78655,
      lat: 32.01352,
      isRealGps: false,
      name: "全季酒店(南京老门东店)"
    };

    let userLocation = { ...DEFAULT_HOTEL };

    // 2. 内置南京核心地铁站网数据库（用于添加新点时提供初始参考，用户修改后完全以用户填写为准）
    const NANJING_SUBWAY_STATIONS = [
      { name: "武定门站", line: "地铁3号线", lng: 118.79311, lat: 32.01389, busHub: "23路/46路" },
      { name: "夫子庙站", line: "地铁3号线/5号线", lng: 118.78912, lat: 32.02291, busHub: "1路/40路" },
      { name: "三山街站", line: "地铁1号线/5号线", lng: 118.78125, lat: 32.02251, busHub: "4路/7路" },
      { name: "朝天宫站", line: "地铁5号线", lng: 118.77551, lat: 32.03381, busHub: "4路/48路/83路" },
      { name: "常府街站", line: "地铁3号线", lng: 118.79245, lat: 32.03312, busHub: "37路/60路" },
      { name: "大行宫站", line: "地铁2号线/3号线", lng: 118.79458, lat: 32.04281, busHub: "5路/9路" },
      { name: "新街口站", line: "地铁1号线/2号线", lng: 118.78411, lat: 32.04162, busHub: "1路/3路" },
      { name: "上海路站", line: "地铁2号线/5号线", lng: 118.77451, lat: 32.04181, busHub: "3路/13路" },
      { name: "鸡鸣寺站", line: "地铁3号线/4号线", lng: 118.79632, lat: 32.05815, busHub: "11路/20路" },
      { name: "云南路站", line: "地铁4号线/5号线", lng: 118.77212, lat: 32.05981, busHub: "13路/318路" },
      { name: "鼓楼站", line: "地铁1号线/4号线", lng: 118.78381, lat: 32.05921, busHub: "3路/11路" },

      { name: "红山动物园站", line: "地铁1号线", lng: 118.79912, lat: 32.09612, busHub: "8路/54路" },
      { name: "南京南站", line: "地铁1号线/3号线/S1号线", lng: 118.79681, lat: 31.96912, busHub: "19路/84路" },
      { name: "明故宫站", line: "地铁2号线", lng: 118.81851, lat: 32.03981, busHub: "5路/34路" },
      { name: "苜蓿园站", line: "地铁2号线", lng: 118.83612, lat: 32.04251, busHub: "20路/315路" },
      { name: "下马坊站", line: "地铁2号线", lng: 118.84851, lat: 32.03951, busHub: "34路/观光车" },
      { name: "天元西路站", line: "地铁3号线", lng: 118.81212, lat: 31.93212, busHub: "G70路" }
    ];

    function calcDistMeters(lng1, lat1, lng2, lat2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // 生成默认初始参考文本
    function generateInitialTransitText(startLng, startLat, endLng, endLat, targetName) {
      const directDist = calcDistMeters(startLng, startLat, endLng, endLat);
      if (directDist <= 1000) {
        const walkMin = Math.max(2, Math.round(directDist / 72));
        return `最快约 ${walkMin} 分钟：距起点仅 ${directDist} 米，直接步行即可到达`;
      }

      let startStation = NANJING_SUBWAY_STATIONS[0], minStartDist = 999999;
      let endStation = NANJING_SUBWAY_STATIONS[0], minEndDist = 999999;

      NANJING_SUBWAY_STATIONS.forEach(st => {
        const d1 = calcDistMeters(startLng, startLat, st.lng, st.lat);
        if (d1 < minStartDist) { minStartDist = d1; startStation = st; }
        const d2 = calcDistMeters(endLng, endLat, st.lng, st.lat);
        if (d2 < minEndDist) { minEndDist = d2; endStation = st; }
      });

      const walkStartMin = Math.max(2, Math.round(minStartDist / 75));
      const walkEndMin = Math.max(2, Math.round(minEndDist / 75));
      const stationDist = calcDistMeters(startStation.lng, startStation.lat, endStation.lng, endStation.lat);
      const estStops = Math.max(1, Math.round(stationDist / 1150));

      const startLines = startStation.line.split('/');
      const endLines = endStation.line.split('/');
      const commonLine = startLines.find(l => endLines.includes(l));

      let transitDesc = '';
      let subwayMin = 0;

      if (commonLine) {
        subwayMin = estStops * 3;
        transitDesc = `乘 ${commonLine}(${startStation.name}➔${endStation.name}, ${estStops}站/约${subwayMin}分)`;
      } else {
        let transferHub = "大行宫站";
        if (endLines.includes("地铁5号线")) transferHub = "夫子庙站";
        else if (endLines.includes("地铁1号线")) transferHub = "新街口站";
        else if (endLines.includes("地铁4号线")) transferHub = "鸡鸣寺站";

        const stops1 = Math.max(1, Math.round(estStops * 0.4));
        const stops2 = Math.max(1, estStops - stops1);
        const min1 = stops1 * 3;
        const min2 = stops2 * 3;
        subwayMin = min1 + min2 + 3;
        transitDesc = `乘 ${startLines[0]}(${startStation.name}➔${transferHub}, ${stops1}站/约${min1}分) ➔ 换乘 ${endLines[0]}(➔${endStation.name}, ${stops2}站/约${min2}分)`;
      }

      const totalMin = walkStartMin + subwayMin + walkEndMin;
      const totalWalk = minStartDist + minEndDist;
      return `最快约 ${totalMin} 分钟：${transitDesc}，步行约 ${totalWalk}米`;
    }

    // =========================================================================
    // 核心升级：解析用户自己填写的路线文本，1:1 同步生成下方的分步换乘卡片！
    // =========================================================================
    function parseUserCustomTransitToSteps(transitText, spot) {
      const directDist = calcDistMeters(userLocation.lng, userLocation.lat, spot.lng, spot.lat);
      const roadDistKm = Math.max(0.2, (directDist * 1.32) / 1000);
      const driveMin = Math.max(4, Math.round(roadDistKm * 2.2 + 3));
      const taxiCost = Math.round(11 + (roadDistKm > 3 ? (roadDistKm - 3) * 2.6 : 0));

      const raw = (transitText || '').trim();
      const steps = [];

      // 提取总步行米数
      const walkMatch = raw.match(/步行[约\s]*(\d+)\s*米/);
      const walkMeters = walkMatch ? parseInt(walkMatch[1]) : 500;

      // 提取用户文本里的总耗时（如果有写“约 X 分钟”）
      const totalTimeMatch = raw.match(/最快约\s*(\d+)\s*分|全程约\s*(\d+)\s*分|约\s*(\d+)\s*分钟/);
      let explicitTotalMin = totalTimeMatch ? parseInt(totalTimeMatch[1] || totalTimeMatch[2] || totalTimeMatch[3]) : null;

      // 将去掉“最快约XX分钟：”前缀后的主体按 ➔ / -> / → / 换乘 / + 切分为各个步骤段
      const bodyText = raw.replace(/^.*?分钟[：:]\s*/, '');
      const rawSegments = bodyText.split(/\s*(?:➔|->|→|换乘|\+|；|;)\s*/).filter(Boolean);

      let accumulatedLineMin = 0;
      let firstStationName = null;

      rawSegments.forEach(segStr => {
        const cleanSeg = segStr.replace(/^[乘坐]\s*/, '').trim();
        if (!cleanSeg) return;

        // 判断是否是纯步行描述
        if (/^步行/.test(cleanSeg) || (/步行/.test(cleanSeg) && !/地铁|公交|\d+号线|\d+路/.test(cleanSeg))) {
          const mMatch = cleanSeg.match(/(\d+)\s*米/);
          const minMatch = cleanSeg.match(/(\d+)\s*分/);
          const m = mMatch ? parseInt(mMatch[1]) : walkMeters;
          const wMin = minMatch ? parseInt(minMatch[1]) : Math.max(2, Math.round(m / 75));
          steps.push({
            type: 'WALK',
            title: cleanSeg,
            minutes: wMin
          });
          return;
        }

        // 匹配 地铁X号线 或 公交X路 或 观光车
        const isSubway = /地铁|号线|S\d+/i.test(cleanSeg);
        const isBus = /公交|\d+路|观光车|专线/i.test(cleanSeg);

        if (isSubway || isBus) {
          // 提取线路名，例如 "地铁3号线" 或 "公交23路"
          const lineNameMatch = cleanSeg.match(/^([^(（\s]+)/);
          const lineName = lineNameMatch ? lineNameMatch[1] : (isSubway ? '地铁线路' : '公交线路');

          // 提取括号内的内容，例如 (武定门站➔夫子庙站, 1站/约3分) 或 (➔张朝天宫站, 2站/约6分)
          const bracketMatch = cleanSeg.match(/[(（]([^)）]+)[)）]/);
          let fromStop = "起点附近站";
          let toStop = `${spot.name}附近站`;
          let stopCount = null;
          let segMin = null;

          if (bracketMatch) {
            const inner = bracketMatch[1];
            // 匹配 几站
            const stopsM = inner.match(/(\d+)\s*站/);
            if (stopsM) stopCount = parseInt(stopsM[1]);
            // 匹配 约几分
            const minM = inner.match(/(\d+)\s*分/);
            if (minM) segMin = parseInt(minM[1]);

            // 提取站点部分 (去掉逗号后面的 X站/约X分)
            const stationPart = inner.split(/[,，]/)[0].trim();
            const arrowParts = stationPart.split(/➔|->|→|至|到/);
            if (arrowParts.length >= 2) {
              fromStop = arrowParts[0].replace(/上车|站上$/g, '').trim() || (lastArrivalStop || "换乘站");
              toStop = arrowParts[1].replace(/下车|站下$/g, '').trim();
            } else if (stationPart) {
              toStop = stationPart.trim();
            }
          }

          if (!firstStationName && fromStop && fromStop !== "起点附近站" && fromStop !== "换乘站") {
            firstStationName = fromStop;
          }
          window._tempLastStop = toStop;

          if (!segMin) segMin = stopCount ? stopCount * 3 : 8;
          accumulatedLineMin += segMin;

          steps.push({
            type: isSubway ? 'SUBWAY' : 'BUS',
            lineName: lineName,
            from: fromStop,
            to: toStop,
            stops: stopCount,
            minutes: segMin,
            rawText: cleanSeg
          });
        } else {
          // 其他自定义描述直接作为卡片展示
          steps.push({
            type: 'CUSTOM',
            title: cleanSeg,
            minutes: 5
          });
        }
      });

      // 处理连续换乘时，如果第二段写的是 "(➔张朝天宫站)" 省略了起点站，自动补全为上一段的终点站
      for (let i = 1; i < steps.length; i++) {
        if ((steps[i].type === 'SUBWAY' || steps[i].type === 'BUS') && (!steps[i].from || steps[i].from === "换乘站" || steps[i].from === "起点附近站")) {
          // 往前找最近一个交通段的终点站
          for (let j = i - 1; j >= 0; j--) {
            if (steps[j].to) {
              steps[i].from = `${steps[j].to} (站内换乘)`;
              break;
            }
          }
        }
      }

      // 如果有地铁/公交段，补充首尾步行提示，使其完整闭环
      const hasTransitStep = steps.some(s => s.type === 'SUBWAY' || s.type === 'BUS');
      const hasWalkStep = steps.some(s => s.type === 'WALK');
      const endWalkMin = Math.max(2, Math.round(walkMeters / 75));

      if (hasTransitStep) {
        if (firstStationName) {
          steps.unshift({
            type: 'WALK',
            title: `从起点步行至【${firstStationName}】`,
            minutes: 5
          });
        }
        if (!hasWalkStep) {
          steps.push({
            type: 'WALK',
            title: `出站步行至【${spot.name}】 (约 ${walkMeters} 米)`,
            minutes: endWalkMin
          });
        } else {
          // 把已有的步行段移到最后并规范显示
          const wIdx = steps.findIndex(s => s.type === 'WALK' && !s.title.includes('从起点'));
          if (wIdx > -1) {
            steps[wIdx].title = `出站${steps[wIdx].title}至【${spot.name}】`;
          }
        }
      } else if (steps.length === 0) {
        // 用户填写的完全是一段自由文本
        steps.push({
          type: 'CUSTOM',
          title: raw || '按自定义路线前往',
          minutes: explicitTotalMin || 15
        });
      }

      const calculatedTotalMin = explicitTotalMin || steps.reduce((acc, cur) => acc + (cur.minutes || 0), 0);

      return {
        totalMin: calculatedTotalMin,
        walkMeters,
        cost: steps.filter(s => s.type === 'SUBWAY' || s.type === 'BUS').length > 1 ? 4 : (hasTransitStep ? 2 : 0),
        steps,
        driveMin,
        roadDistKm: roadDistKm.toFixed(1),
        taxiCost
      };
    }

    // =========================================================================

    // =========================================================================
    const DAYS_STORAGE_KEY = 'nanjing_trip_days_v5';

    let spots = loadSavedSpots();

        `<button onclick="addNewDay()" title="添加新的一天" class="flex-shrink-0 px-2 py-1.5 text-xs rounded-lg font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition">+ 天数</button>`
      ].join('');

      const mHtml = [
        buildTabBtn('all', '全部', true),
        ...dayList.map(d => buildTabBtn(d.id, d.name, true)),
        buildTabBtn(0, '备选', true),
        `<button onclick="addNewDay()" class="flex-shrink-0 px-2.5 py-1 text-xs rounded-full font-bold bg-emerald-50 text-emerald-700 border border-emerald-300 shadow-sm">+ 天数</button>`
      ].join('');

      if (desktopWrap) desktopWrap.innerHTML = dHtml;
      if (mobileWrap) mobileWrap.innerHTML = mHtml;

      // 同步更新添加/编辑弹窗中的下拉框
      const selectEl = document.getElementById('form-spot-day');
      if (selectEl) {
        selectEl.innerHTML = [
          ...dayList.map(d => `<option value="${d.id}">${d.name}</option>`),
          `<option value="0">机动 / 备选打卡</option>`
        ].join('');
      }
    }

    // =========================================================================
    // 6. 手机端搜索聚焦防重叠控制
    // =========================================================================
    function openMobileSearchFocus() {
      document.getElementById('mobile-search-backdrop').classList.remove('hidden');
      document.getElementById('mobile-day-tabs').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('mobile-gps-badge-wrap').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('mobile-search-clear-btn').classList.remove('hidden');
      if (currentInfoWindow) currentInfoWindow.close();
    }

    function closeMobileSearchFocus() {
      document.getElementById('mobile-search-backdrop').classList.add('hidden');
      document.getElementById('mobile-suggest-list').classList.add('hidden');
      document.getElementById('mobile-day-tabs').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('mobile-gps-badge-wrap').classList.remove('opacity-0', 'pointer-events-none');
    }

    function clearMobileSearch() {
      const input = document.getElementById('mobile-search-input');
      input.value = '';
      document.getElementById('mobile-suggest-list').classList.add('hidden');
      document.getElementById('mobile-search-clear-btn').classList.add('hidden');
      closeMobileSearchFocus();
    }

    // =========================================================================
    // 7. 地图初始化与 SortableJS 上下拖拽排序绑定
    // =========================================================================
    function initMap() {
      renderDayTabs();
      renderLists(spots);
      initSortableLists();

      if (typeof AMap === 'undefined') return;

      map = new AMap.Map('amap-container', {
        zoom: 13,
        center: [118.795, 32.035],
        viewMode: '2D'
      });

      renderHotelOriginMarker();

      AMap.plugin(['AMap.PlaceSearch', 'AMap.Geocoder', 'AMap.Geolocation'], function() {
        placeSearchService = new AMap.PlaceSearch({ city: '南京市', citylimit: true });
        geocoderService = new AMap.Geocoder({ city: '南京市' });
      });

      map.on('click', function(e) {
        if (!isAddMode) return;
        handleMapPick(e.lnglat.getLng(), e.lnglat.getLat());
      });

      document.addEventListener('click', function(e) {
        if (!e.target.closest('#desktop-search-input') && !e.target.closest('#desktop-suggest-list')) {
          document.getElementById('desktop-suggest-list').classList.add('hidden');
        }
      });

      render();
    }

    // 初始化上下拖拽排序（电脑端列表 + 手机端列表）
    function initSortableLists() {
      if (typeof Sortable === 'undefined') return;

      const onReorder = function(evt) {
        const container = evt.to;
        const orderedIds = Array.from(container.children)
          .map(el => parseInt(el.dataset.id))
          .filter(Boolean);

        if (orderedIds.length <= 1) return;

        // 将当前视图内被拖拽的打卡点按新顺序写回全局 spots 数组
        const idSet = new Set(orderedIds);
        const reorderedSubset = orderedIds.map(id => spots.find(s => s.id === id)).filter(Boolean);

        let subsetIdx = 0;
        spots = spots.map(s => idSet.has(s.id) ? reorderedSubset[subsetIdx++] : s);

        saveSpotsToStorage();
        render();
      };

      const desktopEl = document.getElementById('desktop-spot-list');
      const mobileEl = document.getElementById('mobile-spot-list');

      if (desktopEl) {
        new Sortable(desktopEl, {
          animation: 180,
          handle: '.drag-handle',
          ghostClass: 'sortable-ghost',
          onEnd: onReorder
        });
      }

      if (mobileEl) {
        new Sortable(mobileEl, {
          animation: 180,
          handle: '.drag-handle',
          ghostClass: 'sortable-ghost',
          onEnd: onReorder
        });
      }
    }

    let originMarker = null;
    function renderHotelOriginMarker() {
      if (!map) return;
      if (originMarker) map.remove(originMarker);

      const el = document.createElement('div');
      el.className = 'relative flex items-center justify-center';
      el.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-rose-600 border-2 border-white shadow-lg flex items-center justify-center text-white font-bold text-[11px]">
          起点
        </div>
        <div class="absolute -bottom-5 bg-rose-700 text-white text-[10px] px-1.5 py-0.5 rounded shadow whitespace-nowrap font-medium">
          ${userLocation.name}
        </div>
      `;
      originMarker = new AMap.Marker({
        position: new AMap.LngLat(userLocation.lng, userLocation.lat),
        content: el,
        offset: new AMap.Pixel(-16, -16),
        zIndex: 120
      });
      map.add(originMarker);
    }

    function render() {
      const filtered = spots.filter(s => currentDayFilter === 'all' || String(s.day) === String(currentDayFilter));
      renderLists(filtered);

      if (!map) return;
      if (markers.length > 0) { map.remove(markers); markers = []; }
      if (polyline) { map.remove(polyline); polyline = null; }

      filtered.forEach((s, idx) => {
        const conf = getDayConfig(s.day);
        const markerEl = document.createElement('div');
        markerEl.className = 'relative flex items-center justify-center cursor-pointer transition transform hover:scale-110';
        const badgeLabel = s.day ? `D${s.day}` : '★';
        markerEl.innerHTML = `
          <div style="background-color: ${conf.color}" class="w-7 h-7 rounded-full shadow-lg border-2 border-white text-white font-bold text-[11px] flex items-center justify-center">
            ${currentDayFilter !== 'all' && s.day ? (idx + 1) : badgeLabel}
          </div>
          <div class="absolute -bottom-4 bg-slate-900/85 text-white text-[10px] px-1.5 py-0.2 rounded shadow whitespace-nowrap pointer-events-none">
            ${s.name.split('·')[0].slice(0, 6)}
          </div>
        `;
        const marker = new AMap.Marker({
          position: new AMap.LngLat(s.lng, s.lat),
          content: markerEl,
          offset: new AMap.Pixel(-14, -14)
        });
        marker.on('click', () => openSpotPopup(s));
        markers.push(marker);
      });
      map.add(markers);

      if (currentDayFilter !== 'all' && String(currentDayFilter) !== '0' && filtered.length > 0) {
        const conf = getDayConfig(currentDayFilter);
        const pathCoords = [[userLocation.lng, userLocation.lat], ...filtered.map(s => [s.lng, s.lat])];
        polyline = new AMap.Polyline({
          path: pathCoords,
          strokeColor: conf.color,
          strokeWeight: 4,
          strokeOpacity: 0.85,
          strokeStyle: 'dashed',
          strokeDasharray: [10, 6],
          isOutline: true,
          outlineColor: '#ffffff',
          borderWeight: 1.5
        });
        map.add(polyline);
      }
    }

    function renderLists(filtered) {
      const desktopList = document.getElementById('desktop-spot-list');
      const desktopCount = document.getElementById('desktop-spot-count');
      if (desktopCount) desktopCount.innerText = `当前显示 ${filtered.length} / 共 ${spots.length} 个打卡点`;

      const mobileList = document.getElementById('mobile-spot-list');
      const mobileCount = document.getElementById('mobile-spot-count-text');
      if (mobileCount) mobileCount.innerText = `当前日程共 ${filtered.length} 个打卡点`;

      if (filtered.length === 0) {
        const emptyHtml = `<div class="text-center py-8 text-slate-400 text-xs">该日程下暂无打卡点，可在上方搜索或点击“选点”添加</div>`;
        if (desktopList) desktopList.innerHTML = emptyHtml;
        if (mobileList) mobileList.innerHTML = emptyHtml;
        return;
      }

      const itemsHtml = filtered.map((s, idx) => {
        const conf = getDayConfig(s.day);
        return `
          <div data-id="${s.id}" class="p-2.5 bg-white border border-slate-200/90 rounded-2xl shadow-sm hover:border-emerald-400 transition cursor-pointer flex items-start gap-2" onclick="focusSpot(${s.id})">
            <!-- 左侧拖拽排序手柄 -->
            <div class="drag-handle pt-1 px-1 text-slate-400 hover:text-emerald-600 flex flex-col items-center flex-shrink-0" onclick="event.stopPropagation()" title="按住上下拖动调整顺序">
              <i data-lucide="grip-vertical" class="w-4 h-4"></i>
              <span class="text-[9px] font-bold text-slate-400">${idx + 1}</span>
            </div>

            <div class="min-w-0 flex-1">
              <div class="flex items-start justify-between gap-1.5 mb-1">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold text-xs text-slate-900 truncate">${s.name}</span>
                    <span class="text-[10px] px-1.5 py-0.2 rounded border ${conf.badge} font-semibold flex-shrink-0">${conf.name}</span>
                  </div>
                  <p class="text-[11px] text-slate-500 line-clamp-1 mt-0.5">💡 ${s.tip}</p>
                </div>

                <!-- 右侧：编辑按钮 + 路线按钮 -->
                <div class="flex items-center gap-1 flex-shrink-0">
                  <button onclick="event.stopPropagation(); openEditSpotModal(${s.id})" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium flex items-center gap-0.5 transition" title="修改此打卡点内容">
                    <i data-lucide="edit-3" class="w-3 h-3"></i> 编辑
                  </button>
                  <button onclick="event.stopPropagation(); startNavigationTo(${s.id})" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-xl text-xs font-semibold flex items-center gap-1 shadow-sm">
                    <i data-lucide="navigation" class="w-3 h-3"></i> 路线
                  </button>
                </div>
              </div>

              <div class="text-[11px] text-blue-700 bg-blue-50/70 px-2 py-1 rounded-lg truncate">
                🚇 ${s.transit || '点击路线查看或编辑换乘'}
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (desktopList) desktopList.innerHTML = itemsHtml;
      if (mobileList) mobileList.innerHTML = itemsHtml;
      lucide.createIcons();
    }

    function openSpotPopup(spot) {
      if (currentInfoWindow) currentInfoWindow.close();
      const conf = getDayConfig(spot.day);

      const dayOptionsHtml = [
        ...dayList.map(d => `<option value="${d.id}" ${spot.day == d.id ? 'selected' : ''}>排到 ${d.name}</option>`),
        `<option value="0" ${spot.day == 0 ? 'selected' : ''}>移入备选</option>`
      ].join('');

      const content = `
        <div class="w-76 bg-white p-3.5 text-xs">
          <div class="flex items-start justify-between mb-1.5">
            <div class="pr-2">
              <h4 class="font-bold text-slate-900 text-sm leading-tight">${spot.name}</h4>
              <span class="text-[10px] text-slate-400">${spot.category} · 耗时: ${spot.timeNeeded} · 门票: ${spot.cost}</span>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded border ${conf.badge} font-semibold flex-shrink-0">${conf.name}</span>
          </div>

          <div class="text-slate-700 bg-amber-50/80 p-2 rounded-xl text-[11px] mb-2 leading-relaxed border border-amber-100">
            <b>💡 攻略：</b>${spot.tip}
          </div>

          <div class="text-blue-800 bg-blue-50/80 p-2 rounded-xl text-[11px] mb-2.5 leading-relaxed border border-blue-100">
            <b>🚇 交通：</b>${spot.transit}
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-100 gap-1.5">
            <select onchange="updateSpotDay(${spot.id}, this.value)" class="text-[11px] bg-slate-50 border border-slate-200 rounded-lg px-1.5 py-1 font-medium">
              ${dayOptionsHtml}
            </select>
            <div class="flex items-center gap-1">
              <button onclick="deleteSpot(${spot.id})" class="text-rose-500 hover:bg-rose-50 rounded-lg text-[11px] px-1.5 py-1">删除</button>
              <button onclick="openEditSpotModal(${spot.id})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded-lg text-[11px] font-semibold flex items-center gap-0.5">
                <i data-lucide="edit-3" class="w-3 h-3"></i> 编辑
              </button>
              <button onclick="startNavigationTo(${spot.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg text-[11px] font-semibold flex items-center gap-1 shadow-sm">
                <i data-lucide="navigation" class="w-3 h-3"></i> 路线
              </button>
            </div>
          </div>
        </div>
      `;

      currentInfoWindow = new AMap.InfoWindow({
        content: content,
        offset: new AMap.Pixel(0, -18)
      });
      currentInfoWindow.open(map, new AMap.LngLat(spot.lng, spot.lat));
      setTimeout(() => lucide.createIcons(), 50);
    }

    // =========================================================================
    // 8. 搜索地点下拉与新增/编辑打卡点 DIY 弹窗
    // =========================================================================
    let searchTimer = null;
    let cachedPois = [];

    function handleSearchInput(keyword, listContainerId) {
      const container = document.getElementById(listContainerId);
      const text = keyword.trim();
      if (!text) {
        container.classList.add('hidden');
        return;
      }

      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        if (!placeSearchService) return;
        placeSearchService.search(text, function(status, result) {
          if (status === 'complete' && result.poiList && result.poiList.pois && result.poiList.pois.length > 0) {
            cachedPois = result.poiList.pois;
            container.innerHTML = cachedPois.map((poi, idx) => {
              const fullAddress = `${poi.adname || ''}${poi.address || '南京市'}`;
              return `
                <div class="p-2 hover:bg-slate-50 rounded-xl flex items-center justify-between gap-2 border-b border-slate-100 last:border-none transition">
                  <div class="min-w-0 flex-1 cursor-pointer" onclick="previewSearchLocation(${idx})">
                    <div class="font-bold text-xs text-slate-900 truncate">${poi.name}</div>
                    <div class="text-[11px] text-slate-500 truncate mt-0.5">📍 ${fullAddress}</div>
                  </div>
                  <button onclick="openAddModalByPoiIndex(${idx})" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-xl text-xs font-semibold flex-shrink-0 flex items-center gap-1 shadow-sm">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> 添加
                  </button>
                </div>
              `;
            }).join('');
            container.classList.remove('hidden');
            lucide.createIcons();
          } else {
            container.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">未找到匹配的南京地点，请换个关键词</div>`;
            container.classList.remove('hidden');
          }
        });
      }, 220);
    }

    function previewSearchLocation(idx) {
      const poi = cachedPois[idx];
      if (!poi || !poi.location) return;
      map.setZoomAndCenter(16, new AMap.LngLat(poi.location.lng, poi.location.lat));
      document.getElementById('desktop-suggest-list').classList.add('hidden');
      closeMobileSearchFocus();
    }

    function openAddModalByPoiIndex(idx) {
      const poi = cachedPois[idx];
      if (!poi || !poi.location) return;

      document.getElementById('desktop-suggest-list').classList.add('hidden');
      closeMobileSearchFocus();

      const fullAddress = `${poi.adname || ''}${poi.address || ''}`;
      triggerAddSpotModal({
        editingSpotId: null,
        name: poi.name,
        lng: poi.location.lng,
        lat: poi.location.lat,
        address: fullAddress || "南京市",
        category: poi.type ? poi.type.split(';')[0] : "景点打卡"
      });
    }

    // 新增打卡点弹窗
    function triggerAddSpotModal(draft) {
      pendingSpotDraft = draft;
      renderDayTabs();

      document.getElementById('modal-form-title').innerText = "添加打卡点到行程";
      document.getElementById('form-spot-name').value = draft.name;
      document.getElementById('form-subtitle').innerText = `详细地址：${draft.address}`;
      const defaultDayId = (currentDayFilter === 'all' || String(currentDayFilter) === '0') ? (dayList[0] ? dayList[0].id : 1) : currentDayFilter;
      document.getElementById('form-spot-day').value = String(defaultDayId);
      document.getElementById('form-spot-time').value = "1.5-2小时";
      document.getElementById('form-spot-cost').value = "免费";
      document.getElementById('form-spot-cat').value = draft.category;
      document.getElementById('form-spot-tip').value = `位于${draft.address}，推荐打卡。`;
      
      const initialTransit = generateInitialTransitText(userLocation.lng, userLocation.lat, draft.lng, draft.lat, draft.name);
      document.getElementById('form-spot-transit').value = initialTransit;

      document.getElementById('custom-add-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    // 编辑已添加的打卡点（100% 复用 DIY 弹窗）
    function openEditSpotModal(spotId) {
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;
      if (currentInfoWindow) currentInfoWindow.close();

      pendingSpotDraft = {
        editingSpotId: spot.id,
        name: spot.name,
        lng: spot.lng,
        lat: spot.lat,
        address: spot.name,
        category: spot.category
      };

      renderDayTabs();
      document.getElementById('modal-form-title').innerText = `编辑【${spot.name}】攻略与路线`;
      document.getElementById('form-subtitle').innerText = `修改后保存将立即同步更新列表与路线卡片`;
      document.getElementById('form-spot-name').value = spot.name;
      document.getElementById('form-spot-day').value = String(spot.day);
      document.getElementById('form-spot-time').value = spot.timeNeeded || "1.5-2小时";
      document.getElementById('form-spot-cost').value = spot.cost || "免费";
      document.getElementById('form-spot-cat').value = spot.category || "景点打卡";
      document.getElementById('form-spot-tip').value = spot.tip || "";
      document.getElementById('form-spot-transit').value = spot.transit || "";

      document.getElementById('custom-add-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function recalcDefaultTransitInModal() {
      if (!pendingSpotDraft) return;
      const name = document.getElementById('form-spot-name').value.trim() || pendingSpotDraft.name;
      document.getElementById('form-spot-transit').value = generateInitialTransitText(
        userLocation.lng, userLocation.lat, pendingSpotDraft.lng, pendingSpotDraft.lat, name
      );
    }

    function closeAddSpotModal() {
      document.getElementById('custom-add-modal').classList.add('hidden');
      pendingSpotDraft = null;
    }

    function submitSaveSpot() {
      if (!pendingSpotDraft) return;
      const name = document.getElementById('form-spot-name').value.trim();
      if (!name) {
        alert("请填写打卡点名称！");
        return;
      }

      const dayVal = parseInt(document.getElementById('form-spot-day').value);
      const timeVal = document.getElementById('form-spot-time').value.trim() || "1.5小时";
      const transitVal = document.getElementById('form-spot-transit').value.trim() || "自行前往";
      const tipVal = document.getElementById('form-spot-tip').value.trim() || "推荐打卡";
      const costVal = document.getElementById('form-spot-cost').value.trim() || "免费";
      const catVal = document.getElementById('form-spot-cat').value.trim() || "景点打卡";

      if (pendingSpotDraft.editingSpotId) {
        // 更新已有打卡点
        const target = spots.find(s => s.id === pendingSpotDraft.editingSpotId);
        if (target) {
          target.name = name;
          target.day = dayVal;
          target.timeNeeded = timeVal;
          target.transit = transitVal;
          target.tip = tipVal;
          target.cost = costVal;
          target.category = catVal;
        }
        saveSpotsToStorage();
        const editedId = pendingSpotDraft.editingSpotId;
        closeAddSpotModal();
        render();
        // 如果当前正打开着该景点的路线导航弹窗，立即同步刷新路线卡片！
        if (activeNavSpot && activeNavSpot.id === editedId && !document.getElementById('nav-modal').classList.contains('hidden')) {
          activeNavSpot = spots.find(s => s.id === editedId);
          calcAndRenderRoute();
        } else {
          focusSpot(editedId);
        }
      } else {
        // 新增打卡点
        const newSpot = {
          id: Date.now(),
          name: name,
          category: catVal,
          lng: pendingSpotDraft.lng,
          lat: pendingSpotDraft.lat,
          day: dayVal,
          timeNeeded: timeVal,
          transit: transitVal,
          tip: tipVal,
          cost: costVal
        };
        spots.push(newSpot);
        saveSpotsToStorage();
        closeAddSpotModal();
        render();
        focusSpot(newSpot.id);
      }
    }

    function handleMapPick(lng, lat) {
      toggleAddMode();
      if (geocoderService && typeof AMap !== 'undefined') {
        geocoderService.getAddress(new AMap.LngLat(lng, lat), function(status, result) {
          let addr = "南京市地图选点";
          let poiName = "自定义打卡点";
          if (status === 'complete' && result.regeocode) {
            addr = result.regeocode.formattedAddress.replace('江苏省南京市', '');
            if (result.regeocode.aois && result.regeocode.aois[0]) {
              poiName = result.regeocode.aois[0].name;
            }
          }
          triggerAddSpotModal({ editingSpotId: null, name: poiName, lng, lat, address: addr, category: "自定义打卡" });
        });
      } else {
        triggerAddSpotModal({ editingSpotId: null, name: "自定义打卡点", lng, lat, address: "南京市地图选点", category: "自定义打卡" });
      }
    }

    // =========================================================================
    // 9. 路线导航弹窗（完全同步渲染用户填写的准确公共交通方案）
    // =========================================================================
    function startNavigationTo(spotId) {
      if (currentInfoWindow) currentInfoWindow.close();
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;
      activeNavSpot = spot;

      document.getElementById('nav-target-title').innerText = `前往 【${spot.name}】`;
      document.getElementById('nav-origin-text').innerText = `起点：${userLocation.name}`;
      
      const modal = document.getElementById('nav-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      calcAndRenderRoute();
    }

    function editCurrentNavSpot() {
      if (!activeNavSpot) return;
      openEditSpotModal(activeNavSpot.id);
    }

    function closeNavModal() {
      const modal = document.getElementById('nav-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function switchNavMode(mode) {
      activeNavMode = mode;
      const btnT = document.getElementById('nav-tab-transit');
      const btnD = document.getElementById('nav-tab-drive');
      if (mode === 'transit') {
        btnT.className = "flex-1 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm transition";
        btnD.className = "flex-1 py-2 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5 transition";
      } else {
        btnD.className = "flex-1 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm transition";
        btnT.className = "flex-1 py-2 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5 transition";
      }
      calcAndRenderRoute();
    }

    function calcAndRenderRoute() {
      const container = document.getElementById('nav-route-details');
      const directAmapUrl = `https://uri.amap.com/navigation?from=${userLocation.lng},${userLocation.lat},${encodeURIComponent(userLocation.name)}&to=${activeNavSpot.lng},${activeNavSpot.lat},${encodeURIComponent(activeNavSpot.name)}&mode=${activeNavMode === 'transit' ? 'bus' : 'car'}`;

      // 核心：直接解析该景点当前保存的 activeNavSpot.transit 路线文本，生成下方同步换乘卡片！
      const parsed = parseUserCustomTransitToSteps(activeNavSpot.transit, activeNavSpot);

      if (activeNavMode === 'transit') {
        let stepsHtml = parsed.steps.map(st => {
          if (st.type === 'SUBWAY' || st.type === 'BUS') {
            const isSub = st.type === 'SUBWAY';
            return `
              <div class="p-3 ${isSub ? 'bg-blue-50 border-blue-200' : 'bg-emerald-50 border-emerald-200'} border rounded-2xl flex items-start justify-between gap-2">
                <div class="flex items-start gap-2.5">
                  <span class="px-2 py-0.5 rounded-lg ${isSub ? 'bg-blue-600' : 'bg-emerald-600'} text-white font-bold text-[10px] flex-shrink-0 mt-0.5">
                    ${isSub ? '地铁' : '公交'}
                  </span>
                  <div>
                    <p class="font-bold text-slate-900 text-xs">${st.lineName}</p>
                    <p class="text-[11px] text-slate-600 mt-0.5"><b>${st.from}</b> 上车 ➔ <b>${st.to}</b> 下车</p>
                  </div>
                </div>
                <div class="text-right flex-shrink-0">
                  <span class="text-xs font-bold ${isSub ? 'text-blue-700' : 'text-emerald-700'}">约 ${st.minutes} 分钟</span>
                  ${st.stops ? `<p class="text-[10px] text-slate-400">途经 ${st.stops} 站</p>` : ''}
                </div>
              </div>
            `;
          } else if (st.type === 'CUSTOM') {
            return `
              <div class="p-3 bg-blue-50 border border-blue-200 rounded-2xl flex items-center justify-between gap-2">
                <span class="font-bold text-slate-800 text-xs">🚇 ${st.title}</span>
              </div>
            `;
          } else {
            return `
              <div class="px-3 py-1.5 bg-slate-50 rounded-xl text-[11px] text-slate-500 flex items-center justify-between">
                <span>🚶 ${st.title}</span>
                <span class="font-medium text-slate-600">约 ${st.minutes} 分钟</span>
              </div>
            `;
          }
        }).join('');

        container.innerHTML = `
          <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-2xl flex justify-between items-center">
            <div>
              <span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded-md font-bold mr-1.5">当前选定方案</span>
              <span class="text-sm font-bold text-emerald-900">全程约 ${parsed.totalMin} 分钟</span>
            </div>
            <span class="text-[11px] text-emerald-700 font-medium">步行约 ${parsed.walkMeters}米</span>
          </div>
          <div class="p-2.5 bg-amber-50/80 border border-amber-200/80 rounded-xl text-[11px] text-amber-900 flex items-start justify-between gap-2">
            <div><b>📌 攻略路线：</b>${activeNavSpot.transit}</div>
          </div>
          <div class="space-y-2 my-2">${stepsHtml}</div>
          <a href="${directAmapUrl}" target="_blank" class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-center font-bold text-xs shadow-md transition">
            唤起高德地图 App 实时公交导航 ↗
          </a>
        `;
      } else {
        container.innerHTML = `
          <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl space-y-2 mb-3">
            <div class="flex justify-between items-center">
              <span class="text-base font-bold text-slate-900">🚕 打车预计 ${parsed.driveMin} 分钟</span>
              <span class="text-sm font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-lg">预估车费 ¥${parsed.taxiCost}</span>
            </div>
            <p class="text-xs text-slate-600">起点：${userLocation.name} ➔ 终点：${activeNavSpot.name}</p>
            <p class="text-[11px] text-slate-500">全程行驶距离约 ${parsed.roadDistKm} 公里</p>
          </div>
          <a href="${directAmapUrl}" target="_blank" class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-center font-bold text-xs shadow-md transition">
            唤起高德地图 App 一键打车/导航 ↗
          </a>
        `;
      }
      lucide.createIcons();
    }

    // =========================================================================
    // 10. 日程切换、GPS 定位与基础操作
    // =========================================================================
    function filterDay(day) {
      currentDayFilter = day;
      renderDayTabs();
      render();
    }

    function focusSpot(id) {
      const spot = spots.find(s => s.id === id);
      if (spot && map) {
        map.setZoomAndCenter(15, new AMap.LngLat(spot.lng, spot.lat));
        openSpotPopup(spot);
      }
    }

    function updateSpotDay(spotId, day) {
      const spot = spots.find(s => s.id === spotId);
      if (spot) {
        spot.day = parseInt(day);
        saveSpotsToStorage();
        render();
        openSpotPopup(spot);
      }
    }

    function deleteSpot(spotId) {
      if (confirm("确定从行程中删除该打卡点吗？")) {
        spots = spots.filter(s => s.id !== spotId);
        saveSpotsToStorage();
        if (currentInfoWindow) currentInfoWindow.close();
        render();
      }
    }

    function toggleAddMode() {
      isAddMode = !isAddMode;
      const toast = document.getElementById('add-mode-toast');
      const mobileBtn = document.getElementById('mobile-add-mode-btn');
      const desktopBtn = document.getElementById('desktop-add-mode-btn');

      if (isAddMode) {
        toast.classList.remove('hidden');
        if (mobileBtn) { mobileBtn.classList.add('bg-emerald-600', 'text-white'); mobileBtn.classList.remove('bg-white', 'text-emerald-600'); }
        if (desktopBtn) { desktopBtn.classList.add('bg-emerald-600', 'text-white'); desktopBtn.classList.remove('bg-slate-50', 'text-emerald-600'); }
      } else {
        toast.classList.add('hidden');
        if (mobileBtn) { mobileBtn.classList.remove('bg-emerald-600', 'text-white'); mobileBtn.classList.add('bg-white', 'text-emerald-600'); }
        if (desktopBtn) { desktopBtn.classList.remove('bg-emerald-600', 'text-white'); desktopBtn.classList.add('bg-slate-50', 'text-emerald-600'); }
      }
    }

    function getUserLocation() {
      const mobileStatus = document.getElementById('mobile-gps-status-text');
      const desktopStatus = document.getElementById('desktop-gps-status-text');
      if (mobileStatus) mobileStatus.innerText = "正在获取实时 GPS 定位...";
      if (desktopStatus) desktopStatus.innerText = "正在获取实时 GPS 定位...";

      AMap.plugin('AMap.Geolocation', function() {
        const geolocation = new AMap.Geolocation({
          enableHighAccuracy: true,
          timeout: 5000,
          needAddress: true
        });

        geolocation.getCurrentPosition(function(status, result) {
          if (status === 'complete' && result.position) {
            // 如果当前人在外地（距离南京新街口超过 80 公里），自动保持以南京全季酒店(老门东店)为攻略基准起点，避免外地定位干扰南京市内路线
            const distToNanjing = calcDistMeters(result.position.lng, result.position.lat, DEFAULT_HOTEL.lng, DEFAULT_HOTEL.lat);
            if (distToNanjing > 80000) {
              userLocation = { ...DEFAULT_HOTEL };
              const msg = `当前不在南京，保持起点：${DEFAULT_HOTEL.name}`;
              if (mobileStatus) mobileStatus.innerText = msg;
              if (desktopStatus) desktopStatus.innerText = msg;
              renderHotelOriginMarker();
              map.setCenter(new AMap.LngLat(DEFAULT_HOTEL.lng, DEFAULT_HOTEL.lat));
              return;
            }

            userLocation = {
              lng: result.position.lng,
              lat: result.position.lat,
              isRealGps: true,
              name: result.formattedAddress ? result.formattedAddress.replace('江苏省南京市', '') : "我的南京实时位置"
            };
            const text = `实时起点：${userLocation.name}`;
            if (mobileStatus) mobileStatus.innerText = text;
            if (desktopStatus) desktopStatus.innerText = text;
            renderHotelOriginMarker();
            map.setCenter(new AMap.LngLat(userLocation.lng, userLocation.lat));
          } else {
            userLocation = { ...DEFAULT_HOTEL };
            const fallbackText = `默认起点：${DEFAULT_HOTEL.name}`;
            if (mobileStatus) mobileStatus.innerText = fallbackText;
            if (desktopStatus) desktopStatus.innerText = fallbackText;
            renderHotelOriginMarker();
            map.setCenter(new AMap.LngLat(DEFAULT_HOTEL.lng, DEFAULT_HOTEL.lat));
          }
        });
      });
    }

    function toggleDrawerHeight() {
      const drawer = document.getElementById('bottom-drawer');
      const tip = document.getElementById('drawer-toggle-tip');
      const icon = document.getElementById('drawer-toggle-icon');
      isDrawerExpanded = !isDrawerExpanded;

      if (isDrawerExpanded) {
        drawer.style.height = '65dvh';
        tip.innerText = "下滑收起列表";
        icon.setAttribute('data-lucide', 'chevron-down');
      } else {
        drawer.style.height = '230px';
        tip.innerText = "按住 ⠿ 可拖动排序 · 上滑展开";
        icon.setAttribute('data-lucide', 'chevron-up');
      }
      lucide.createIcons();
    }

    function exportCurrentSpotsToCode() {
      const code = JSON.stringify(spots, null, 2);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => {
          alert("✅ 最新定稿数据已复制到剪贴板！\n\n前往 GitHub 仓库编辑 index.html，替换 DEFAULT_SPOTS 数组即可同步给伴侣。");
        }).catch(() => {
          prompt("请复制下方定稿数据：", code);
        });
      } else {
        prompt("请复制下方定稿数据：", code);
      }
    }

    window.onload = () => {
      initMap();
      lucide.createIcons();
    };
  </script>
</body>
</html>
