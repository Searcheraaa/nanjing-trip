<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>南京旅游攻略打卡地图</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 高德地图安全密钥与 JS API -->
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: "514a23571b3ffbf7725fb77dc7ddcca7", 
    };
  </script>
  <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=265a60ea1a814174cc37ffee8c260055&plugin=AMap.ToolBar,AMap.Scale,AMap.Geolocation,AMap.Transfer,AMap.Driving,AMap.PlaceSearch,AMap.AutoComplete,AMap.Geocoder"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(10px, env(safe-area-inset-top)); }
    .amap-info-content { padding: 0 !important; border-radius: 14px !important; overflow: hidden; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased overflow-hidden h-[100dvh] w-screen flex flex-col md:flex-row relative select-none">

  <!-- ========================================================
       【电脑端 UI】左侧工作台侧边栏 (md:flex)
  ======================================================== -->
  <aside id="desktop-sidebar" class="hidden md:flex md:w-96 h-full bg-white border-r border-slate-200 z-20 flex-col shadow-xl transition-all duration-300">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
      <div>
        <h1 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="map-pin" class="w-5 h-5 text-emerald-600"></i>
          南京行程规划助手
        </h1>
        <p class="text-xs text-slate-500 mt-0.5">电脑版工作台 · 支持实时同步</p>
      </div>
      <button onclick="exportCurrentSpotsToCode()" title="导出代码同步到GitHub" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-900 text-white text-xs font-semibold rounded-xl flex items-center gap-1 shadow transition">
        <i data-lucide="share" class="w-3.5 h-3.5"></i>
        <span>导出配置</span>
      </button>
    </div>

    <!-- 电脑端搜索框与模糊推荐容器 -->
    <div class="p-3 border-b border-slate-100 space-y-2 relative">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5 pointer-events-none"></i>
        <input 
          id="desktop-search-input" 
          type="text" 
          placeholder="输入南京地点(如: 鸡鸣寺、老门东)..." 
          autocomplete="off"
          class="w-full pl-8 pr-2 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 transition"
          oninput="handleSearchInput(this.value, 'desktop-suggest-list')"
          onfocus="handleSearchInput(this.value, 'desktop-suggest-list')"
        />
        <!-- 模糊搜索下拉推荐面板 -->
        <div id="desktop-suggest-list" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-2xl shadow-2xl z-50 max-h-72 overflow-y-auto p-1.5 space-y-1"></div>
      </div>

      <div class="flex items-center justify-between gap-2">
        <button id="desktop-add-mode-btn" onclick="toggleAddMode()" class="flex-1 py-1.5 bg-slate-50 border border-emerald-500 text-emerald-600 text-xs font-medium rounded-xl flex items-center justify-center gap-1 hover:bg-emerald-50 transition">
          <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
          <span>地图选点</span>
        </button>
        <button onclick="getUserLocation()" class="px-3 py-1.5 bg-slate-50 border border-slate-200 text-slate-600 text-xs rounded-xl flex items-center gap-1 hover:bg-slate-100 transition">
          <i data-lucide="locate-fixed" class="w-3.5 h-3.5 text-emerald-600"></i>
          <span>基准定位</span>
        </button>
      </div>
    </div>

    <!-- 电脑端日程过滤 -->
    <div class="p-2 border-b border-slate-100 flex gap-1 bg-slate-50/70 overflow-x-auto no-scrollbar">
      <button onclick="filterDay('all')" class="day-filter-btn flex-1 py-1 text-xs rounded-lg font-medium bg-emerald-600 text-white shadow-sm" data-day="all">全部</button>
      <button onclick="filterDay(1)" class="day-filter-btn flex-1 py-1 text-xs rounded-lg font-medium bg-white text-slate-600 hover:bg-slate-100" data-day="1">D1</button>
      <button onclick="filterDay(2)" class="day-filter-btn flex-1 py-1 text-xs rounded-lg font-medium bg-white text-slate-600 hover:bg-slate-100" data-day="2">D2</button>
      <button onclick="filterDay(3)" class="day-filter-btn flex-1 py-1 text-xs rounded-lg font-medium bg-white text-slate-600 hover:bg-slate-100" data-day="3">D3</button>
      <button onclick="filterDay(0)" class="day-filter-btn flex-1 py-1 text-xs rounded-lg font-medium bg-white text-slate-600 hover:bg-slate-100" data-day="0">备选</button>
    </div>

    <!-- 电脑端景点打卡列表容器 -->
    <div id="desktop-spot-list" class="flex-1 overflow-y-auto p-3 space-y-2"></div>

    <div class="p-3 bg-slate-50 border-t border-slate-100 text-[11px] text-slate-500 flex justify-between items-center">
      <span id="desktop-spot-count">加载中...</span>
      <span class="text-emerald-600">点击列表定位查看</span>
    </div>
  </aside>

  <!-- ========================================================
       【手机端 UI】顶部悬浮流 (md:hidden)
  ======================================================== -->
  <header class="md:hidden absolute top-0 left-0 right-0 z-30 pointer-events-none safe-top px-3">
    <div class="flex flex-col gap-2 max-w-md mx-auto">
      
      <!-- 第一层：搜索框 + 选点 + 定位 + 导出 -->
      <div class="relative pointer-events-auto bg-white/95 backdrop-blur-md rounded-2xl shadow-lg border border-slate-200/80 p-1.5 flex items-center gap-1.5">
        <div class="relative flex-1 flex items-center min-w-0">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 pointer-events-none"></i>
          <input 
            id="mobile-search-input" 
            type="text" 
            placeholder="搜南京景点(如:鸡鸣寺、老门东)..." 
            autocomplete="off"
            class="w-full pl-8 pr-2 py-1.5 text-xs bg-slate-50 border border-slate-200/60 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 transition"
            oninput="handleSearchInput(this.value, 'mobile-suggest-list')"
            onfocus="handleSearchInput(this.value, 'mobile-suggest-list')"
          />
        </div>

        <button id="mobile-add-mode-btn" onclick="toggleAddMode()" class="px-2 py-1.5 bg-white border border-emerald-500 text-emerald-600 text-xs font-medium rounded-xl flex items-center gap-1 flex-shrink-0">
          <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
          <span>选点</span>
        </button>

        <button onclick="getUserLocation()" title="当前定位" class="p-1.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 active:bg-slate-100 flex-shrink-0">
          <i data-lucide="locate-fixed" class="w-4 h-4 text-emerald-600"></i>
        </button>

        <button onclick="exportCurrentSpotsToCode()" title="复制数据" class="px-2 py-1.5 bg-slate-800 text-white text-xs font-semibold rounded-xl flex items-center gap-1 flex-shrink-0 shadow">
          <i data-lucide="share" class="w-3 h-3"></i>
          <span>导出</span>
        </button>

        <!-- 手机端模糊推荐下拉面板 -->
        <div id="mobile-suggest-list" class="hidden absolute top-full left-0 right-0 mt-2 bg-white/98 backdrop-blur-md border border-slate-200 rounded-2xl shadow-2xl z-50 max-h-64 overflow-y-auto p-1.5 space-y-1"></div>
      </div>

      <!-- 第二层：日程横向单行滑动 -->
      <div class="pointer-events-auto flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 px-0.5">
        <button onclick="filterDay('all')" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-emerald-600 text-white shadow-md transition" data-day="all">全部日程</button>
        <button onclick="filterDay(1)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="1">D1 钟山秦淮</button>
        <button onclick="filterDay(2)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="2">D2 总统府民国</button>
        <button onclick="filterDay(3)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="3">D3 玄武湖风光</button>
        <button onclick="filterDay(0)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="0">备选打卡</button>
      </div>

      <!-- 第三层：定位状态 -->
      <div class="pointer-events-auto self-start">
        <div class="bg-slate-900/85 backdrop-blur-sm text-white text-[11px] px-2.5 py-1 rounded-full shadow flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="mobile-gps-status-text">未开GPS，默认基准点：新街口</span>
        </div>
      </div>

    </div>
  </header>

  <!-- ========================================================
       地图容器主体
  ======================================================== -->
  <main class="flex-1 h-full w-full relative">
    <div id="amap-container" class="w-full h-full"></div>

    <!-- 选点状态浮条 -->
    <div id="add-mode-toast" class="hidden absolute top-24 md:top-6 left-1/2 -translate-x-1/2 z-30 bg-slate-900/90 text-white text-xs px-4 py-2 rounded-full shadow-lg flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      在地图目标位置轻点即可新增打卡点
      <button onclick="toggleAddMode()" class="ml-2 underline text-slate-300">取消</button>
    </div>
  </main>

  <!-- ========================================================
       【手机端 UI】底部抽屉 (md:hidden)
  ======================================================== -->
  <div id="bottom-drawer" class="md:hidden fixed left-0 right-0 bottom-0 z-20 bg-white/95 backdrop-blur-md rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.15)] border-t border-slate-200 transition-all duration-300 flex flex-col max-h-[75dvh] h-[220px]">
    <div onclick="toggleDrawerHeight()" class="pt-2 pb-1.5 flex flex-col items-center cursor-pointer">
      <div class="w-10 h-1 bg-slate-300 rounded-full mb-1.5"></div>
      <div class="flex items-center justify-between w-full px-5 text-xs text-slate-500 font-medium">
        <span id="mobile-spot-count-text">加载中...</span>
        <span class="text-emerald-600 flex items-center gap-0.5">
          <span id="drawer-toggle-tip">上滑查看列表</span>
          <i id="drawer-toggle-icon" data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
        </span>
      </div>
    </div>

    <div id="mobile-spot-list" class="flex-1 overflow-y-auto px-4 py-2 space-y-2 safe-bottom"></div>
  </div>

  <!-- ========================================================
       自定义添加/编辑打卡点弹窗 (全新交互表单，取代丑陋 prompt)
  ======================================================== -->
  <div id="custom-add-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-5 space-y-3.5 transform transition-all border border-slate-100">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div>
          <h3 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
            <i data-lucide="map-pin-plus" class="w-5 h-5 text-emerald-600"></i>
            加入行程攻略
          </h3>
          <p id="form-subtitle" class="text-[11px] text-slate-400 truncate max-w-[280px]">南京市详细地点</p>
        </div>
        <button onclick="closeAddSpotModal()" class="p-1 rounded-full text-slate-400 hover:bg-slate-100">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="space-y-2.5 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">地点名称</label>
          <input id="form-spot-name" type="text" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">安排日程</label>
            <select id="form-spot-day" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500">
              <option value="1">Day 1 (钟山秦淮)</option>
              <option value="2">Day 2 (总统府民国)</option>
              <option value="3">Day 3 (玄武湖风光)</option>
              <option value="0">机动 / 备选打卡</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">建议耗时</label>
            <input id="form-spot-time" type="text" value="1.5-2小时" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">推荐公共交通 (地铁/公交)</label>
          <input id="form-spot-transit" type="text" placeholder="地铁/公交路线，可直接修改或清空" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">攻略备忘 & 小吃提示</label>
          <textarea id="form-spot-tip" rows="2" placeholder="填写必拍机位、预约提醒、必吃小吃等..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500"></textarea>
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">门票费用</label>
            <input id="form-spot-cost" type="text" value="免费" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
          </div>
          <div class="flex-1">
            <label class="block font-semibold text-slate-700 mb-1">分类标签</label>
            <input id="form-spot-cat" type="text" value="自定义打卡" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="closeAddSpotModal()" class="flex-1 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">取消</button>
        <button onclick="submitSaveNewSpot()" class="flex-1 py-2 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md transition">保存加入行程</button>
      </div>
    </div>
  </div>

  <!-- ========================================================
       通用路线导航面板 (带 5 秒超时保护与降级高德 App 唤起)
  ======================================================== -->
  <div id="nav-modal" class="fixed inset-x-0 bottom-0 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-[480px] z-40 bg-white rounded-t-3xl md:rounded-3xl shadow-2xl border border-slate-200 transform translate-y-full md:translate-y-0 md:hidden transition-transform duration-300 max-h-[75dvh] flex flex-col safe-bottom">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50 rounded-t-3xl">
      <div class="min-w-0 pr-2">
        <div class="flex items-center gap-1.5 text-emerald-700 font-bold text-sm truncate">
          <i data-lucide="navigation" class="w-4 h-4 flex-shrink-0"></i>
          <span id="nav-target-title" class="truncate">路线规划</span>
        </div>
        <p id="nav-origin-text" class="text-[11px] text-slate-500 truncate mt-0.5">起点：南京新街口</p>
      </div>
      <button onclick="closeNavModal()" class="p-1 rounded-full bg-slate-200/60 active:bg-slate-300 text-slate-600">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="px-4 pt-3 flex gap-2">
      <button id="nav-tab-transit" onclick="switchNavMode('transit')" class="flex-1 py-1.5 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm">
        <i data-lucide="bus" class="w-3.5 h-3.5"></i> 公共交通 (地铁/公交)
      </button>
      <button id="nav-tab-drive" onclick="switchNavMode('drive')" class="flex-1 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5">
        <i data-lucide="car" class="w-3.5 h-3.5"></i> 打车 / 自驾
      </button>
    </div>

    <div id="nav-route-details" class="flex-1 overflow-y-auto p-4 space-y-2 text-xs">
      <div class="text-center py-6 text-slate-400">正在计算推荐路线...</div>
    </div>
  </div>

  <!-- ========================================================
       核心 JavaScript
  ======================================================== -->
  <script>
    const DEFAULT_SPOTS = [
      { id: 1, name: "钟山风景区·中山陵", category: "名胜", lng: 118.84888, lat: 32.06173, day: 1, timeNeeded: "2.5小时", transit: "地铁2号线苜蓿园/下马坊站换乘景区观光车", tip: "需要提前在微信公众号实名预约。登台阶约392级。", cost: "陵寝免费(套票100)" },
      { id: 2, name: "夫子庙与秦淮风光带", category: "文化/夜景", lng: 118.78854, lat: 32.01956, day: 1, timeNeeded: "2小时", transit: "地铁3号线夫子庙站2号口步行300米", tip: "建议傍晚落日后来，夜泊秦淮游船极有氛围。品尝鸭血粉丝汤。", cost: "街区免费" },
      { id: 3, name: "南京总统府", category: "历史", lng: 118.79815, lat: 32.04389, day: 2, timeNeeded: "2小时", transit: "地铁2/3号线大行宫站5号口直达", tip: "周一闭馆！融合中西建筑与江南园林，建议听语音讲解。", cost: "35元" },
      { id: 4, name: "颐和路民国公馆区", category: "街区/拍照", lng: 118.76182, lat: 32.06282, day: 2, timeNeeded: "1.5小时", transit: "公交318路颐和路站 / 地铁4号线云南路站步行", tip: "“一条颐和路，半部民国史”。秋季黄叶掩映下的黄墙格外适合人像摄影。", cost: "免费" },
      { id: 5, name: "玄武湖公园", category: "自然湖泊", lng: 118.79848, lat: 32.07222, day: 3, timeNeeded: "2-3小时", transit: "地铁1号线玄武门站3号口直通", tip: "可以租电动船游湖，或登上古城墙远眺紫金山与玄武湖全景。", cost: "公园免费" },
      { id: 6, name: "牛首山文化旅游区", category: "建筑瑰宝", lng: 118.75012, lat: 31.91485, day: 0, timeNeeded: "半天", transit: "地铁S1号线至佛城西路站打车10分钟", tip: "佛顶宫建筑极其壮观震撼。距离市区稍远，适合单独半天游览。", cost: "145元" }
    ];

    function loadSavedSpots() {
      const saved = localStorage.getItem('my_nanjing_trip_local_cache');
      if (saved) {
        try { return JSON.parse(saved); } catch(e) { console.error(e); }
      }
      return DEFAULT_SPOTS;
    }

    function saveSpotsToStorage() {
      localStorage.setItem('my_nanjing_trip_local_cache', JSON.stringify(spots));
    }

    let spots = loadSavedSpots();
    let currentDayFilter = 'all';
    let userLocation = { lng: 118.78411, lat: 32.04162, isRealGps: false, name: "南京新街口 (基准点)" };
    let map = null, markers = [], polyline = null, currentInfoWindow = null;
    let isAddMode = false;
    let activeNavSpot = null;
    let activeNavMode = 'transit';
    let transferService = null, drivingService = null;
    let autoDataService = null;
    let isDrawerExpanded = false;
    let pendingSpotDraft = null; // 当前正在编辑准备保存的新点

    const DAY_CONFIG = {
      1: { color: "#2563eb", name: "D1 钟山秦淮", badge: "bg-blue-50 text-blue-700 border-blue-200" },
      2: { color: "#16a34a", name: "D2 总统府民国", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
      3: { color: "#d97706", name: "D3 玄武湖风光", badge: "bg-amber-50 text-amber-700 border-amber-200" },
      0: { color: "#64748b", name: "备选打卡", badge: "bg-slate-50 text-slate-600 border-slate-200" }
    };

    function initMap() {
      map = new AMap.Map('amap-container', {
        zoom: 12,
        center: [118.796, 32.045],
        viewMode: '2D'
      });

      // 核心修复：纯数据模式（不直接挂载 map），避免图层冲突死锁
      transferService = new AMap.Transfer({ city: '南京市', policy: AMap.TransferPolicy.LEAST_TIME });
      drivingService = new AMap.Driving({ city: '南京市' });
      autoDataService = new AMap.AutoComplete({ city: '南京市' });

      map.on('click', function(e) {
        if (!isAddMode) return;
        handleMapPick(e.lnglat.getLng(), e.lnglat.getLat());
      });

      // 点击外部关闭搜索推荐下拉
      document.addEventListener('click', function(e) {
        if (!e.target.closest('#desktop-search-input') && !e.target.closest('#desktop-suggest-list')) {
          document.getElementById('desktop-suggest-list').classList.add('hidden');
        }
        if (!e.target.closest('#mobile-search-input') && !e.target.closest('#mobile-suggest-list')) {
          document.getElementById('mobile-suggest-list').classList.add('hidden');
        }
      });

      render();
    }

    function render() {
      if (markers.length > 0) { map.remove(markers); markers = []; }
      if (polyline) { map.remove(polyline); polyline = null; }

      const filtered = spots.filter(s => currentDayFilter === 'all' || s.day == currentDayFilter);

      filtered.forEach(s => {
        const conf = DAY_CONFIG[s.day] || DAY_CONFIG[0];
        const markerEl = document.createElement('div');
        markerEl.className = 'relative flex items-center justify-center cursor-pointer';
        markerEl.innerHTML = `
          <div style="background-color: ${conf.color}" class="w-7 h-7 rounded-full shadow-lg border-2 border-white text-white font-bold text-xs flex items-center justify-center">
            ${s.day ? 'D'+s.day : '★'}
          </div>
          <div class="absolute -bottom-4 bg-slate-900/80 text-white text-[9px] px-1 rounded whitespace-nowrap pointer-events-none">
            ${s.name.split('·')[0].slice(0, 5)}
          </div>
        `;
        const marker = new AMap.Marker({
          position: [s.lng, s.lat],
          content: markerEl,
          offset: new AMap.Pixel(-14, -14)
        });
        marker.on('click', () => openSpotPopup(s));
        markers.push(marker);
      });
      map.add(markers);

      if (currentDayFilter !== 'all' && currentDayFilter !== '0' && filtered.length > 1) {
        polyline = new AMap.Polyline({
          path: filtered.map(s => [s.lng, s.lat]),
          strokeColor: DAY_CONFIG[currentDayFilter].color,
          strokeWeight: 4,
          strokeOpacity: 0.8,
          strokeStyle: 'dashed',
          strokeDasharray: [8, 5]
        });
        map.add(polyline);
      }

      renderLists(filtered);
    }

    function renderLists(filtered) {
      const desktopList = document.getElementById('desktop-spot-list');
      const desktopCount = document.getElementById('desktop-spot-count');
      if (desktopCount) desktopCount.innerText = `当前显示 ${filtered.length} / 共 ${spots.length} 个`;

      const mobileList = document.getElementById('mobile-spot-list');
      const mobileCount = document.getElementById('mobile-spot-count-text');
      if (mobileCount) mobileCount.innerText = `共 ${filtered.length} 个打卡点`;

      if (filtered.length === 0) {
        const emptyHtml = `<div class="text-center py-6 text-slate-400 text-xs">该日程下无打卡点，点击“选点”添加</div>`;
        if (desktopList) desktopList.innerHTML = emptyHtml;
        if (mobileList) mobileList.innerHTML = emptyHtml;
        return;
      }

      const itemsHtml = filtered.map(s => {
        const conf = DAY_CONFIG[s.day] || DAY_CONFIG[0];
        return `
          <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between gap-2 hover:bg-slate-100 cursor-pointer transition" onclick="focusSpot(${s.id})">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 mb-1">
                <span class="font-bold text-xs text-slate-900 truncate">${s.name}</span>
                <span class="text-[9px] px-1.5 py-0.2 rounded border ${conf.badge} flex-shrink-0">${conf.name}</span>
              </div>
              <p class="text-[11px] text-slate-500 truncate">${s.tip}</p>
            </div>
            <button onclick="event.stopPropagation(); startNavigationTo(${s.id})" class="px-2.5 py-1.5 bg-emerald-600 active:bg-emerald-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1 flex-shrink-0 shadow-sm">
              <i data-lucide="navigation" class="w-3 h-3"></i> 路线
            </button>
          </div>
        `;
      }).join('');

      if (desktopList) desktopList.innerHTML = itemsHtml;
      if (mobileList) mobileList.innerHTML = itemsHtml;
      lucide.createIcons();
    }

    function openSpotPopup(spot) {
      if (currentInfoWindow) currentInfoWindow.close();
      const conf = DAY_CONFIG[spot.day] || DAY_CONFIG[0];

      const content = `
        <div class="w-72 bg-white p-3 text-xs">
          <div class="flex items-start justify-between mb-1.5">
            <div>
              <h4 class="font-bold text-slate-900 text-sm leading-tight">${spot.name}</h4>
              <span class="text-[10px] text-slate-400">${spot.category} · 门票: ${spot.cost}</span>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded border ${conf.badge}">${conf.name}</span>
          </div>

          <p class="text-slate-600 bg-amber-50/70 p-2 rounded-lg text-[11px] mb-2 leading-relaxed">
            💡 ${spot.tip}
          </p>

          <p class="text-slate-500 bg-blue-50/60 p-2 rounded-lg text-[10px] mb-2 leading-relaxed">
            🚌 推荐交通: ${spot.transit}
          </p>

          <div class="flex items-center justify-between pt-2 border-t border-slate-100 gap-2">
            <select onchange="updateSpotDay(${spot.id}, this.value)" class="text-[11px] bg-slate-50 border border-slate-200 rounded px-1.5 py-1">
              <option value="1" ${spot.day==1?'selected':''}>排到 D1</option>
              <option value="2" ${spot.day==2?'selected':''}>排到 D2</option>
              <option value="3" ${spot.day==3?'selected':''}>排到 D3</option>
              <option value="0" ${spot.day==0?'selected':''}>移入备选</option>
            </select>
            <div class="flex gap-1.5">
              <button onclick="deleteSpot(${spot.id})" class="text-rose-500 text-[11px] px-2 py-1">删除</button>
              <button onclick="startNavigationTo(${spot.id})" class="bg-emerald-600 text-white px-3 py-1 rounded-lg text-[11px] font-semibold flex items-center gap-1">
                <i data-lucide="navigation" class="w-3 h-3"></i> 导航
              </button>
            </div>
          </div>
        </div>
      `;

      currentInfoWindow = new AMap.InfoWindow({
        content: content,
        offset: new AMap.Pixel(0, -18)
      });
      currentInfoWindow.open(map, [spot.lng, spot.lat]);
      setTimeout(() => lucide.createIcons(), 50);
    }

    // ==========================================
    // 模糊搜索与地点推荐下拉实现
    // ==========================================
    let searchTimer = null;
    function handleSearchInput(keyword, listContainerId) {
      const container = document.getElementById(listContainerId);
      const text = keyword.trim();
      if (!text) {
        container.classList.add('hidden');
        return;
      }

      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        if (!autoDataService) return;
        autoDataService.search(text, function(status, result) {
          if (status === 'complete' && result.tips && result.tips.length > 0) {
            // 过滤有效经纬度的地点
            const validTips = result.tips.filter(item => item.location && item.location.lng);
            if (validTips.length === 0) {
              container.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">暂未搜到明确地址，请补充关键词</div>`;
              container.classList.remove('hidden');
              return;
            }

            container.innerHTML = validTips.map((tip, idx) => `
              <div class="p-2 hover:bg-slate-50 rounded-xl flex items-center justify-between gap-2 border-b border-slate-50 last:border-none transition">
                <div class="min-w-0 flex-1 cursor-pointer" onclick="previewSearchLocation(${tip.location.lng}, ${tip.location.lat}, '${tip.name}')">
                  <div class="font-bold text-xs text-slate-800 truncate">${tip.name}</div>
                  <div class="text-[10px] text-slate-400 truncate mt-0.5">${tip.district || ''}${tip.address || '南京市'}</div>
                </div>
                <button onclick="openAddSpotModalFromPOI('${escape(JSON.stringify(tip))}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-lg text-xs font-semibold flex-shrink-0 flex items-center gap-1 shadow-sm">
                  <i data-lucide="plus" class="w-3 h-3"></i> 添加
                </button>
              </div>
            `).join('');

            container.classList.remove('hidden');
            lucide.createIcons();
          } else {
            container.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">未找到相关地点</div>`;
            container.classList.remove('hidden');
          }
        });
      }, 250);
    }

    function previewSearchLocation(lng, lat, name) {
      map.setZoomAndCenter(15, [lng, lat]);
      // 关闭推荐下拉
      document.getElementById('desktop-suggest-list').classList.add('hidden');
      document.getElementById('mobile-suggest-list').classList.add('hidden');
    }

    // ==========================================
    // 结构化弹窗：配置并加入行程
    // ==========================================
    function openAddSpotModalFromPOI(escapedData) {
      const poi = JSON.parse(unescape(escapedData));
      document.getElementById('desktop-suggest-list').classList.add('hidden');
      document.getElementById('mobile-suggest-list').classList.add('hidden');

      const fullAddr = `${poi.district || ''}${poi.address || ''}`;
      pendingSpotDraft = {
        name: poi.name,
        lng: poi.location.lng,
        lat: poi.location.lat,
        address: fullAddr || "南京市",
        category: poi.type ? poi.type.split(';')[0] : "景点/打卡"
      };

      document.getElementById('form-spot-name').value = poi.name;
      document.getElementById('form-subtitle').innerText = pendingSpotDraft.address;
      document.getElementById('form-spot-day').value = (currentDayFilter === 'all' || currentDayFilter === '0') ? '1' : currentDayFilter;
      document.getElementById('form-spot-time').value = "1.5-2小时";
      document.getElementById('form-spot-cost').value = "免费";
      document.getElementById('form-spot-cat').value = pendingSpotDraft.category;
      document.getElementById('form-spot-tip').value = "推荐打卡机位，提前留意开放时间。";
      document.getElementById('form-spot-transit').value = fullAddr ? `前往${fullAddr}` : "地铁或打车前往";

      // 异步预估公共交通
      transferService.search([userLocation.lng, userLocation.lat], [poi.location.lng, poi.location.lat], function(status, res) {
        if (status === 'complete' && res.plans && res.plans[0]) {
          const lines = [];
          res.plans[0].segments.forEach(seg => {
            if (seg.transit && seg.transit.lines && seg.transit.lines[0]) {
              lines.push(seg.transit.lines[0].name.split('(')[0]);
            }
          });
          if (lines.length > 0) {
            document.getElementById('form-spot-transit').value = `乘 ${lines.join(' 换乘 ')} 直达附近`;
          }
        }
      });

      document.getElementById('custom-add-modal').classList.remove('hidden');
    }

    function closeAddSpotModal() {
      document.getElementById('custom-add-modal').classList.add('hidden');
      pendingSpotDraft = null;
    }

    function submitSaveNewSpot() {
      if (!pendingSpotDraft) return;
      const name = document.getElementById('form-spot-name').value.trim();
      if (!name) {
        alert("请输入地点名称！");
        return;
      }

      const newSpot = {
        id: Date.now(),
        name: name,
        category: document.getElementById('form-spot-cat').value.trim() || "打卡点",
        lng: pendingSpotDraft.lng,
        lat: pendingSpotDraft.lat,
        day: parseInt(document.getElementById('form-spot-day').value),
        timeNeeded: document.getElementById('form-spot-time').value.trim() || "1.5小时",
        transit: document.getElementById('form-spot-transit').value.trim() || "自行前往",
        tip: document.getElementById('form-spot-tip').value.trim() || "特色打卡",
        cost: document.getElementById('form-spot-cost').value.trim() || "免费"
      };

      spots.push(newSpot);
      saveSpotsToStorage();
      closeAddSpotModal();
      render();
      focusSpot(newSpot.id);
    }

    function handleMapPick(lng, lat) {
      // 通过高德逆地理编码读取真实路名
      const geocoder = new AMap.Geocoder({ city: "南京市" });
      geocoder.getAddress([lng, lat], function(status, result) {
        let addr = "南京市选点";
        if (status === 'complete' && result.regeocode) {
          addr = result.regeocode.formattedAddress;
        }

        pendingSpotDraft = {
          name: "自定义打卡点",
          lng: lng,
          lat: lat,
          address: addr,
          category: "机位/美食"
        };

        document.getElementById('form-spot-name').value = "新打卡点";
        document.getElementById('form-subtitle').innerText = addr;
        document.getElementById('form-spot-day').value = (currentDayFilter === 'all' || currentDayFilter === '0') ? '1' : currentDayFilter;
        document.getElementById('form-spot-time').value = "1.5小时";
        document.getElementById('form-spot-cost').value = "免费";
        document.getElementById('form-spot-cat').value = "自定义";
        document.getElementById('form-spot-tip').value = "绝佳拍照角度/特色小吃";
        document.getElementById('form-spot-transit').value = "打车或地铁直达";

        toggleAddMode();
        document.getElementById('custom-add-modal').classList.remove('hidden');
      });
    }

    // ==========================================
    // 路线规划与超时保护（彻底修复一直加载 Bug）
    // ==========================================
    function startNavigationTo(spotId) {
      if (currentInfoWindow) currentInfoWindow.close();
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;
      activeNavSpot = spot;

      document.getElementById('nav-target-title').innerText = `前往 【${spot.name}】`;
      document.getElementById('nav-origin-text').innerText = `起点：${userLocation.name}`;
      
      const modal = document.getElementById('nav-modal');
      modal.classList.remove('translate-y-full');
      modal.classList.remove('md:hidden');
      calcAndRenderRoute();
    }

    function closeNavModal() {
      const modal = document.getElementById('nav-modal');
      modal.classList.add('translate-y-full');
      modal.classList.add('md:hidden');
    }

    function switchNavMode(mode) {
      activeNavMode = mode;
      const btnT = document.getElementById('nav-tab-transit');
      const btnD = document.getElementById('nav-tab-drive');
      if (mode === 'transit') {
        btnT.className = "flex-1 py-1.5 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm";
        btnD.className = "flex-1 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5";
      } else {
        btnD.className = "flex-1 py-1.5 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm";
        btnT.className = "flex-1 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5";
      }
      calcAndRenderRoute();
    }

    function calcAndRenderRoute() {
      const container = document.getElementById('nav-route-details');
      container.innerHTML = `
        <div class="text-center py-8 space-y-2 text-slate-400">
          <div class="inline-block w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-xs">正在高德计算推荐路线...</p>
        </div>
      `;

      const start = [userLocation.lng, userLocation.lat];
      const end = [activeNavSpot.lng, activeNavSpot.lat];
      const directAmapUrl = `https://uri.amap.com/navigation?from=${start[0]},${start[1]},我的位置&to=${end[0]},${end[1]},${activeNavSpot.name}&mode=${activeNavMode === 'transit' ? 'bus' : 'car'}`;

      let hasResponded = false;
      // 5秒超时安全熔断机制，杜绝一直卡死
      const timeoutId = setTimeout(() => {
        if (!hasResponded) {
          hasResponded = true;
          renderFallbackRoute(container, directAmapUrl, "公共交通查询超时或网络波动");
        }
      }, 5000);

      if (activeNavMode === 'transit') {
        transferService.search(start, end, function(status, result) {
          if (hasResponded) return;
          hasResponded = true;
          clearTimeout(timeoutId);

          if (status === 'complete' && result.plans && result.plans.length > 0) {
            const plan = result.plans[0];
            const durationMin = Math.round(plan.time / 60);
            const walkM = plan.walking_distance;

            let stepsHtml = '';
            plan.segments.forEach((seg) => {
              if (seg.transit_mode === 'SUBWAY' || seg.transit_mode === 'BUS') {
                const line = seg.transit.lines[0];
                stepsHtml += `
                  <div class="p-2.5 bg-blue-50 border border-blue-200/70 rounded-xl flex items-start gap-2">
                    <span class="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px] flex-shrink-0 mt-0.5">乘</span>
                    <div>
                      <p class="font-bold text-slate-800 text-xs">乘坐【${line.name}】(${line.via_num}站)</p>
                      <p class="text-[11px] text-slate-500 mt-0.5">${line.departure_stop.name} 上车 → ${line.arrival_stop.name} 下车</p>
                    </div>
                  </div>
                `;
              } else if (seg.transit_mode === 'WALK' && seg.instruction) {
                stepsHtml += `
                  <div class="px-3 py-1 text-[11px] text-slate-500 flex items-center gap-1.5">
                    <i data-lucide="footprints" class="w-3.5 h-3.5"></i> ${seg.instruction}
                  </div>
                `;
              }
            });

            container.innerHTML = `
              <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl mb-2 flex justify-between items-center">
                <div>
                  <span class="text-sm font-bold text-emerald-800">约 ${durationMin} 分钟</span>
                  <span class="text-[11px] text-emerald-600 ml-1">票价约 ¥${plan.cost || 4}</span>
                </div>
                <span class="text-[11px] text-slate-500">步行约 ${walkM} 米</span>
              </div>
              <div class="space-y-1.5 mb-3">${stepsHtml}</div>
              <a href="${directAmapUrl}" target="_blank" class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-center font-bold text-xs shadow-md transition">
                唤起高德地图 App 实时导航 ↗
              </a>
            `;
            lucide.createIcons();
          } else {
            renderFallbackRoute(container, directAmapUrl, "两地距离较近或无直达公交方案");
          }
        });
      } else {
        drivingService.search(start, end, function(status, result) {
          if (hasResponded) return;
          hasResponded = true;
          clearTimeout(timeoutId);

          if (status === 'complete' && result.routes && result.routes.length > 0) {
            const route = result.routes[0];
            const durationMin = Math.round(route.time / 60);
            const distKm = (route.distance / 1000).toFixed(1);
            const taxiCost = Math.round(11 + (distKm > 3 ? (distKm - 3) * 2.4 : 0));

            container.innerHTML = `
              <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl mb-3">
                <div class="flex justify-between items-center mb-1">
                  <span class="text-sm font-bold text-emerald-800">打车/自驾约 ${durationMin} 分钟</span>
                  <span class="text-xs font-bold text-amber-600">预估打车 ¥${taxiCost}</span>
                </div>
                <div class="text-[11px] text-slate-500">全程约 ${distKm} 公里 · 途径 ${route.steps.length} 个路段</div>
              </div>
              <a href="${directAmapUrl}" target="_blank" class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-center font-bold text-xs shadow-md transition">
                唤起高德地图 App 实时导航 ↗
              </a>
            `;
          } else {
            renderFallbackRoute(container, directAmapUrl, "未能计算出驾车路线");
          }
        });
      }
    }

    function renderFallbackRoute(container, directUrl, reason) {
      container.innerHTML = `
        <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-center space-y-2 mb-3">
          <p class="font-bold text-amber-900 text-xs">${reason}</p>
          <p class="text-[11px] text-slate-500">已为你自动生成高德地图 App 的实时导航直通通道：</p>
        </div>
        <a href="${directUrl}" target="_blank" class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-center font-bold text-xs shadow-md transition">
          唤起高德地图 App 实时导航 ↗
        </a>
      `;
    }

    // ==========================================
    // 基础辅助函数
    // ==========================================
    function updateSpotDay(spotId, day) {
      const spot = spots.find(s => s.id === spotId);
      if (spot) {
        spot.day = parseInt(day);
        saveSpotsToStorage();
        render();
        openSpotPopup(spot);
      }
    }

    function deleteSpot(spotId) {
      if (confirm("确定从日程中移除此打卡点吗？")) {
        spots = spots.filter(s => s.id !== spotId);
        saveSpotsToStorage();
        if (currentInfoWindow) currentInfoWindow.close();
        render();
      }
    }

    function toggleAddMode() {
      isAddMode = !isAddMode;
      const toast = document.getElementById('add-mode-toast');
      const mobileBtn = document.getElementById('mobile-add-mode-btn');
      const desktopBtn = document.getElementById('desktop-add-mode-btn');

      if (isAddMode) {
        toast.classList.remove('hidden');
        if (mobileBtn) { mobileBtn.classList.add('bg-emerald-600', 'text-white'); mobileBtn.classList.remove('bg-white', 'text-emerald-600'); }
        if (desktopBtn) { desktopBtn.classList.add('bg-emerald-600', 'text-white'); desktopBtn.classList.remove('bg-slate-50', 'text-emerald-600'); }
      } else {
        toast.classList.add('hidden');
        if (mobileBtn) { mobileBtn.classList.remove('bg-emerald-600', 'text-white'); mobileBtn.classList.add('bg-white', 'text-emerald-600'); }
        if (desktopBtn) { desktopBtn.classList.remove('bg-emerald-600', 'text-white'); desktopBtn.classList.add('bg-slate-50', 'text-emerald-600'); }
      }
    }

    function exportCurrentSpotsToCode() {
      const code = JSON.stringify(spots, null, 2);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => {
          alert("✅ 最新定稿数据已复制到剪贴板！\n\n前往 GitHub 仓库编辑 index.html，替换 DEFAULT_SPOTS 数组即可完成同步。");
        }).catch(() => {
          prompt("请手动复制下方数据内容：", code);
        });
      } else {
        prompt("请手动复制下方数据内容：", code);
      }
    }

    function toggleDrawerHeight() {
      const drawer = document.getElementById('bottom-drawer');
      const tip = document.getElementById('drawer-toggle-tip');
      const icon = document.getElementById('drawer-toggle-icon');
      isDrawerExpanded = !isDrawerExpanded;

      if (isDrawerExpanded) {
        drawer.style.height = '60dvh';
        tip.innerText = "下滑收起";
        icon.setAttribute('data-lucide', 'chevron-down');
      } else {
        drawer.style.height = '220px';
        tip.innerText = "上滑查看完整";
        icon.setAttribute('data-lucide', 'chevron-up');
      }
      lucide.createIcons();
    }

    function getUserLocation() {
      const mobileStatus = document.getElementById('mobile-gps-status-text');
      if (mobileStatus) mobileStatus.innerText = "正在获取定位...";

      const geolocation = new AMap.Geolocation({
        enableHighAccuracy: true,
        timeout: 8000,
        needAddress: true
      });

      geolocation.getCurrentPosition(function(status, result) {
        if (status === 'complete') {
          userLocation = {
            lng: result.position.lng,
            lat: result.position.lat,
            isRealGps: true,
            name: result.formattedAddress ? result.formattedAddress.slice(0, 15) : "我的真实定位"
          };
          if (mobileStatus) mobileStatus.innerText = `GPS 已定位：${userLocation.name}`;
          map.setCenter([userLocation.lng, userLocation.lat]);
        } else {
          if (mobileStatus) mobileStatus.innerText = "定位受限，已使用新街口作为基准点";
        }
      });
    }

    function filterDay(day) {
      currentDayFilter = day;
      document.querySelectorAll('.day-filter-btn').forEach(btn => {
        if (btn.dataset.day == day) {
          btn.className = "day-filter-btn flex-1 md:flex-initial flex-shrink-0 px-3 py-1 text-xs rounded-full md:rounded-lg font-medium bg-emerald-600 text-white shadow-md transition";
        } else {
          btn.className = "day-filter-btn flex-1 md:flex-initial flex-shrink-0 px-3 py-1 text-xs rounded-full md:rounded-lg font-medium bg-white text-slate-700 border border-slate-200 shadow-sm transition";
        }
      });
      render();
    }

    function focusSpot(id) {
      const spot = spots.find(s => s.id === id);
      if (spot) {
        map.setZoomAndCenter(15, [spot.lng, spot.lat]);
        openSpotPopup(spot);
      }
    }

    window.onload = () => {
      initMap();
      lucide.createIcons();
    };
  </script>
</body>
</html>
