<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 关键：加入 viewport-fit=cover 与禁止双击缩放破坏 UI -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>南京旅游攻略打卡地图</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- 高德地图安全密钥与 JS API -->
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: "514a23571b3ffbf7725fb77dc7ddcca7", 
    };
  </script>
  <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=265a60ea1a814174cc37ffee8c260055&plugin=AMap.ToolBar,AMap.Scale,AMap.Geolocation,AMap.Transfer,AMap.Driving,AMap.PlaceSearch,AMap.AutoComplete,AMap.Geocoder"></script>

  <style>
    /* 隐藏横向滚动条但保持可滚动 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 适配 iOS 底部手势栏安全距离 */
    .safe-bottom {
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .safe-top {
      padding-top: max(10px, env(safe-area-inset-top));
    }
    /* 高德自带控件微调 */
    .amap-info-content {
      padding: 0 !important;
      border-radius: 14px !important;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased overflow-hidden h-[100dvh] w-screen flex flex-col relative select-none">

  <!-- ========================================================
       1. 顶部悬浮控制区（单一体积容器，垂直流式排列，杜绝互相遮挡）
  ======================================================== -->
  <header class="absolute top-0 left-0 right-0 z-30 pointer-events-none safe-top px-3">
    <div class="flex flex-col gap-2 max-w-md mx-auto">
      
      <!-- 第一层：搜索框 + 选点 + 定位 -->
      <div class="pointer-events-auto bg-white/95 backdrop-blur-md rounded-2xl shadow-lg border border-slate-200/80 p-1.5 flex items-center gap-1.5">
        <div class="relative flex-1 flex items-center min-w-0">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 pointer-events-none"></i>
          <input 
            id="search-input" 
            type="text" 
            placeholder="搜索南京景点 (如: 鸡鸣寺、老门东)..." 
            class="w-full pl-8 pr-2 py-1.5 text-xs bg-slate-50 border border-slate-200/60 rounded-xl focus:bg-white focus:outline-none focus:border-emerald-500 transition"
          />
        </div>
        
        <button onclick="handleManualSearch()" class="px-2.5 py-1.5 bg-emerald-600 active:bg-emerald-700 text-white text-xs font-semibold rounded-xl flex-shrink-0 transition">
          找点
        </button>

        <button id="add-mode-btn" onclick="toggleAddMode()" class="px-2 py-1.5 bg-white border border-emerald-500 text-emerald-600 text-xs font-medium rounded-xl flex items-center gap-1 flex-shrink-0 active:bg-emerald-50 transition">
          <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
          <span>选点</span>
        </button>

        <button onclick="getUserLocation()" title="当前定位" class="p-1.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 active:bg-slate-100 flex-shrink-0">
          <i data-lucide="locate-fixed" class="w-4 h-4 text-emerald-600"></i>
        </button>
      </div>

      <!-- 第二层：日程选择（横向单行自然滑动，不换行、不挡字） -->
      <div class="pointer-events-auto flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 px-0.5">
        <button onclick="filterDay('all')" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-emerald-600 text-white shadow-md transition" data-day="all">全部日程</button>
        <button onclick="filterDay(1)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="1">D1 钟山秦淮</button>
        <button onclick="filterDay(2)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="2">D2 总统府民国</button>
        <button onclick="filterDay(3)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="3">D3 玄武湖风光</button>
        <button onclick="filterDay(0)" class="day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition" data-day="0">备选打卡</button>
      </div>

      <!-- 第三层：紧凑型 GPS 状态胶囊 -->
      <div class="pointer-events-auto self-start">
        <div id="gps-status-badge" class="bg-slate-900/85 backdrop-blur-sm text-white text-[11px] px-2.5 py-1 rounded-full shadow flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="gps-status-text">未开GPS，默认基准点：新街口</span>
        </div>
      </div>

    </div>
  </header>

  <!-- ========================================================
       2. 底层高德地图容器 (占据完整视口)
  ======================================================== -->
  <main class="w-full h-full flex-1 relative">
    <div id="amap-container" class="w-full h-full"></div>

    <!-- 选点状态提示条 -->
    <div id="add-mode-toast" class="hidden absolute top-32 left-1/2 -translate-x-1/2 z-20 bg-slate-900/90 text-white text-xs px-4 py-2 rounded-full shadow-lg flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      在地图目标位置轻点即可新增打卡点
      <button onclick="toggleAddMode()" class="ml-2 underline text-slate-300">取消</button>
    </div>
  </main>

  <!-- ========================================================
       3. 底部抽屉：景点列表 (折叠 / 展开状态)
  ======================================================== -->
  <div id="bottom-drawer" class="fixed left-0 right-0 bottom-0 z-20 bg-white/95 backdrop-blur-md rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.15)] border-t border-slate-200 transition-all duration-300 flex flex-col max-h-[75dvh] h-[220px]">
    <!-- 拖动手柄区 -->
    <div onclick="toggleDrawerHeight()" class="pt-2 pb-1.5 flex flex-col items-center cursor-pointer">
      <div class="w-10 h-1 bg-slate-300 rounded-full mb-1.5"></div>
      <div class="flex items-center justify-between w-full px-5 text-xs text-slate-500 font-medium">
        <span id="spot-count-text">加载中...</span>
        <span class="text-emerald-600 flex items-center gap-0.5">
          <span id="drawer-toggle-tip">上滑查看列表</span>
          <i id="drawer-toggle-icon" data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
        </span>
      </div>
    </div>

    <!-- 打卡点纵向滚动卡片列表 -->
    <div id="spot-list-container" class="flex-1 overflow-y-auto px-4 py-2 space-y-2 safe-bottom">
      <!-- 动态注入景点卡片 -->
    </div>
  </div>

  <!-- ========================================================
       4. 路线规划弹窗：改为优雅的“底部抽屉”弹窗，不再顶破屏幕
  ======================================================== -->
  <div id="nav-modal" class="fixed inset-x-0 bottom-0 z-40 bg-white rounded-t-3xl shadow-2xl border-t border-slate-200 transform translate-y-full transition-transform duration-300 max-h-[75dvh] flex flex-col safe-bottom">
    
    <!-- 弹窗顶栏 -->
    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50 rounded-t-3xl">
      <div class="min-w-0 pr-2">
        <div class="flex items-center gap-1.5 text-emerald-700 font-bold text-sm truncate">
          <i data-lucide="navigation" class="w-4 h-4 flex-shrink-0"></i>
          <span id="nav-target-title" class="truncate">路线规划</span>
        </div>
        <p id="nav-origin-text" class="text-[11px] text-slate-500 truncate mt-0.5">起点：南京新街口</p>
      </div>
      <button onclick="closeNavModal()" class="p-1 rounded-full bg-slate-200/60 active:bg-slate-300 text-slate-600">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 交通方式切换 Tab (公共交通 / 打车) -->
    <div class="px-4 pt-3 flex gap-2">
      <button id="nav-tab-transit" onclick="switchNavMode('transit')" class="flex-1 py-1.5 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm">
        <i data-lucide="bus" class="w-3.5 h-3.5"></i> 公共交通 (地铁/公交)
      </button>
      <button id="nav-tab-drive" onclick="switchNavMode('drive')" class="flex-1 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5">
        <i data-lucide="car" class="w-3.5 h-3.5"></i> 打车 / 自驾
      </button>
    </div>

    <!-- 导航换乘具体线路列表（可独立滚动） -->
    <div id="nav-route-details" class="flex-1 overflow-y-auto p-4 space-y-2 text-xs">
      <div class="text-center py-6 text-slate-400">正在规划推荐路线...</div>
    </div>
  </div>

  <!-- ========================================================
       业务核心脚本
  ======================================================== -->
  <script>
    // 预置南京经典路线景点（火星坐标 GCJ-02）
    let spots = [
      { id: 1, name: "钟山风景区·中山陵", category: "名胜", lng: 118.84888, lat: 32.06173, day: 1, timeNeeded: "2.5小时", transit: "地铁2号线苜蓿园/下马坊站换乘景区观光车", tip: "需要提前在微信公众号实名预约。登台阶约392级。", cost: "陵寝免费(套票100)" },
      { id: 2, name: "夫子庙与秦淮风光带", category: "文化/夜景", lng: 118.78854, lat: 32.01956, day: 1, timeNeeded: "2小时", transit: "地铁3号线夫子庙站2号口步行300米", tip: "建议傍晚落日后来，夜泊秦淮游船极有氛围。品尝鸭血粉丝汤。", cost: "街区免费" },
      { id: 3, name: "南京总统府", category: "历史", lng: 118.79815, lat: 32.04389, day: 2, timeNeeded: "2小时", transit: "地铁2/3号线大行宫站5号口直达", tip: "周一闭馆！融合中西建筑与江南园林，建议听语音讲解。", cost: "35元" },
      { id: 4, name: "颐和路民国公馆区", category: "街区/拍照", lng: 118.76182, lat: 32.06282, day: 2, timeNeeded: "1.5小时", transit: "公交318路颐和路站 / 地铁4号线云南路站步行", tip: "“一条颐和路，半部民国史”。秋季黄叶掩映下的黄墙格外适合人像摄影。", cost: "免费" },
      { id: 5, name: "玄武湖公园", category: "自然湖泊", lng: 118.79848, lat: 32.07222, day: 3, timeNeeded: "2-3小时", transit: "地铁1号线玄武门站3号口直通", tip: "可以租电动船游湖，或登上古城墙远眺紫金山与玄武湖全景。", cost: "公园免费" },
      { id: 6, name: "牛首山文化旅游区", category: "建筑瑰宝", lng: 118.75012, lat: 31.91485, day: 0, timeNeeded: "半天", transit: "地铁S1号线至佛城西路站打车10分钟", tip: "佛顶宫建筑极其壮观震撼。距离市区稍远，适合单独半天游览。", cost: "145元" }
    ];

    let currentDayFilter = 'all';
    let userLocation = { lng: 118.78411, lat: 32.04162, isRealGps: false, name: "南京新街口 (基准点)" };
    let map = null, markers = [], polyline = null, currentInfoWindow = null;
    let isAddMode = false;
    let activeNavSpot = null;
    let activeNavMode = 'transit';
    let transferService = null, drivingService = null;
    let isDrawerExpanded = false;

    const DAY_CONFIG = {
      1: { color: "#2563eb", name: "D1 钟山秦淮", badge: "bg-blue-50 text-blue-700 border-blue-200" },
      2: { color: "#16a34a", name: "D2 总统府民国", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" },
      3: { color: "#d97706", name: "D3 玄武湖风光", badge: "bg-amber-50 text-amber-700 border-amber-200" },
      0: { color: "#64748b", name: "备选打卡", badge: "bg-slate-50 text-slate-600 border-slate-200" }
    };

    // 初始化高德地图
    function initMap() {
      map = new AMap.Map('amap-container', {
        zoom: 12,
        center: [118.796, 32.045],
        viewMode: '2D'
      });

      // 路径规划服务对象
      transferService = new AMap.Transfer({ map: map, city: '南京市' });
      drivingService = new AMap.Driving({ map: map });

      // 地图点击选点
      map.on('click', function(e) {
        if (!isAddMode) return;
        handleMapPick(e.lnglat.getLng(), e.lnglat.getLat());
      });

      render();
    }

    // 渲染 Marker 与当天线路
    function render() {
      if (markers.length > 0) { map.remove(markers); markers = []; }
      if (polyline) { map.remove(polyline); polyline = null; }

      const filtered = spots.filter(s => currentDayFilter === 'all' || s.day == currentDayFilter);

      filtered.forEach(s => {
        const conf = DAY_CONFIG[s.day] || DAY_CONFIG[0];
        const markerEl = document.createElement('div');
        markerEl.className = 'relative flex items-center justify-center cursor-pointer';
        markerEl.innerHTML = `
          <div style="background-color: ${conf.color}" class="w-7 h-7 rounded-full shadow-lg border-2 border-white text-white font-bold text-xs flex items-center justify-center">
            ${s.day ? 'D'+s.day : '★'}
          </div>
          <div class="absolute -bottom-4 bg-slate-900/80 text-white text-[9px] px-1 rounded whitespace-nowrap pointer-events-none">
            ${s.name.split('·')[0].slice(0, 5)}
          </div>
        `;
        const marker = new AMap.Marker({
          position: [s.lng, s.lat],
          content: markerEl,
          offset: new AMap.Pixel(-14, -14)
        });
        marker.on('click', () => openSpotPopup(s));
        markers.push(marker);
      });
      map.add(markers);

      // 单独某天路线虚线
      if (currentDayFilter !== 'all' && currentDayFilter !== '0' && filtered.length > 1) {
        polyline = new AMap.Polyline({
          path: filtered.map(s => [s.lng, s.lat]),
          strokeColor: DAY_CONFIG[currentDayFilter].color,
          strokeWeight: 4,
          strokeOpacity: 0.8,
          strokeStyle: 'dashed',
          strokeDasharray: [8, 5]
        });
        map.add(polyline);
      }

      renderList(filtered);
    }

    // 渲染底部卡片列表
    function renderList(filtered) {
      const container = document.getElementById('spot-list-container');
      document.getElementById('spot-count-text').innerText = `共 ${filtered.length} 个打卡点`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">该日程下无打卡点，点击顶部“选点”添加</div>`;
        return;
      }

      container.innerHTML = filtered.map(s => {
        const conf = DAY_CONFIG[s.day] || DAY_CONFIG[0];
        return `
          <div class="p-2.5 bg-slate-50 border border-slate-200/90 rounded-2xl flex items-center justify-between gap-2 active:bg-slate-100" onclick="focusSpot(${s.id})">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 mb-0.5">
                <span class="font-bold text-xs text-slate-900 truncate">${s.name}</span>
                <span class="text-[9px] px-1.5 py-0.2 rounded border ${conf.badge} flex-shrink-0">${conf.name}</span>
              </div>
              <p class="text-[11px] text-slate-500 truncate">${s.tip}</p>
            </div>
            <button onclick="event.stopPropagation(); startNavigationTo(${s.id})" class="px-2.5 py-1.5 bg-emerald-600 active:bg-emerald-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1 flex-shrink-0 shadow-sm">
              <i data-lucide="navigation" class="w-3 h-3"></i> 路线
            </button>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // 地图弹窗
    function openSpotPopup(spot) {
      if (currentInfoWindow) currentInfoWindow.close();
      const conf = DAY_CONFIG[spot.day] || DAY_CONFIG[0];

      const content = `
        <div class="w-72 bg-white p-3 text-xs">
          <div class="flex items-start justify-between mb-1.5">
            <div>
              <h4 class="font-bold text-slate-900 text-sm leading-tight">${spot.name}</h4>
              <span class="text-[10px] text-slate-400">${spot.category} · 门票: ${spot.cost}</span>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded border ${conf.badge}">${conf.name}</span>
          </div>

          <p class="text-slate-600 bg-amber-50/70 p-2 rounded-lg text-[11px] mb-2 leading-relaxed">
            💡 ${spot.tip}
          </p>

          <div class="flex items-center justify-between pt-2 border-t border-slate-100 gap-2">
            <select onchange="updateSpotDay(${spot.id}, this.value)" class="text-[11px] bg-slate-50 border border-slate-200 rounded px-1.5 py-1">
              <option value="1" ${spot.day==1?'selected':''}>排到 D1</option>
              <option value="2" ${spot.day==2?'selected':''}>排到 D2</option>
              <option value="3" ${spot.day==3?'selected':''}>排到 D3</option>
              <option value="0" ${spot.day==0?'selected':''}>移入备选</option>
            </select>
            <div class="flex gap-1.5">
              <button onclick="deleteSpot(${spot.id})" class="text-rose-500 text-[11px] px-2 py-1">删除</button>
              <button onclick="startNavigationTo(${spot.id})" class="bg-emerald-600 text-white px-3 py-1 rounded-lg text-[11px] font-semibold flex items-center gap-1">
                <i data-lucide="navigation" class="w-3 h-3"></i> 导航
              </button>
            </div>
          </div>
        </div>
      `;

      currentInfoWindow = new AMap.InfoWindow({
        content: content,
        offset: new AMap.Pixel(0, -18)
      });
      currentInfoWindow.open(map, [spot.lng, spot.lat]);
      setTimeout(() => lucide.createIcons(), 50);
    }

    // 导航路线拉起
    function startNavigationTo(spotId) {
      if (currentInfoWindow) currentInfoWindow.close();
      const spot = spots.find(s => s.id === spotId);
      if (!spot) return;
      activeNavSpot = spot;

      document.getElementById('nav-target-title').innerText = `前往 【${spot.name}】`;
      document.getElementById('nav-origin-text').innerText = `起点：${userLocation.name}`;
      
      const modal = document.getElementById('nav-modal');
      modal.classList.remove('translate-y-full');

      calcAndRenderRoute();
    }

    function closeNavModal() {
      document.getElementById('nav-modal').classList.add('translate-y-full');
      if (transferService) transferService.clear();
      if (drivingService) drivingService.clear();
    }

    function switchNavMode(mode) {
      activeNavMode = mode;
      const btnT = document.getElementById('nav-tab-transit');
      const btnD = document.getElementById('nav-tab-drive');
      if (mode === 'transit') {
        btnT.className = "flex-1 py-1.5 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm";
        btnD.className = "flex-1 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5";
      } else {
        btnD.className = "flex-1 py-1.5 text-xs font-semibold rounded-xl bg-emerald-600 text-white flex items-center justify-center gap-1.5 shadow-sm";
        btnT.className = "flex-1 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5";
      }
      calcAndRenderRoute();
    }

    function calcAndRenderRoute() {
      const container = document.getElementById('nav-route-details');
      container.innerHTML = `<div class="text-center py-6 text-slate-400">正在高德地图中实时计算路线...</div>`;

      const start = [userLocation.lng, userLocation.lat];
      const end = [activeNavSpot.lng, activeNavSpot.lat];

      if (activeNavMode === 'transit') {
        if (drivingService) drivingService.clear();
        transferService.search(start, end, function(status, result) {
          if (status === 'complete' && result.plans && result.plans.length > 0) {
            const plan = result.plans[0];
            const durationMin = Math.round(plan.time / 60);
            const walkM = plan.walking_distance;

            let stepsHtml = '';
            plan.segments.forEach((seg, idx) => {
              if (seg.transit_mode === 'SUBWAY' || seg.transit_mode === 'BUS') {
                const line = seg.transit.lines[0];
                stepsHtml += `
                  <div class="p-2.5 bg-blue-50 border border-blue-200/70 rounded-xl flex items-start gap-2">
                    <span class="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px] flex-shrink-0 mt-0.5">乘</span>
                    <div>
                      <p class="font-bold text-slate-800 text-xs">乘坐【${line.name}】(${line.via_num}站)</p>
                      <p class="text-[11px] text-slate-500 mt-0.5">${line.departure_stop.name} 上车 → ${line.arrival_stop.name} 下车</p>
                    </div>
                  </div>
                `;
              } else if (seg.transit_mode === 'WALK' && seg.instruction) {
                stepsHtml += `
                  <div class="px-3 py-1 text-[11px] text-slate-500 flex items-center gap-1.5">
                    <i data-lucide="footprints" class="w-3.5 h-3.5"></i> ${seg.instruction}
                  </div>
                `;
              }
            });

            container.innerHTML = `
              <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl mb-2 flex justify-between items-center">
                <div>
                  <span class="text-sm font-bold text-emerald-800">约 ${durationMin} 分钟</span>
                  <span class="text-[11px] text-emerald-600 ml-1">票价约 ¥${plan.cost || 4}</span>
                </div>
                <span class="text-[11px] text-slate-500">步行约 ${walkM} 米</span>
              </div>
              <div class="space-y-1.5">${stepsHtml}</div>
            `;
          } else {
            container.innerHTML = `<div class="text-center py-4 text-slate-400">两地距离极近或暂无直达公交地铁，建议步行或打车。</div>`;
          }
          lucide.createIcons();
        });
      } else {
        if (transferService) transferService.clear();
        drivingService.search(start, end, function(status, result) {
          if (status === 'complete' && result.routes && result.routes.length > 0) {
            const route = result.routes[0];
            const durationMin = Math.round(route.time / 60);
            const distKm = (route.distance / 1000).toFixed(1);
            const taxiCost = Math.round(11 + (distKm > 3 ? (distKm - 3) * 2.4 : 0));

            container.innerHTML = `
              <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl mb-3">
                <div class="flex justify-between items-center mb-1">
                  <span class="text-sm font-bold text-emerald-800">打车/驾车约 ${durationMin} 分钟</span>
                  <span class="text-xs font-bold text-amber-600">预估打车 ¥${taxiCost}</span>
                </div>
                <div class="text-[11px] text-slate-500">全程约 ${distKm} 公里 · 途径 ${route.steps.length} 个路段</div>
              </div>
              <a href="https://uri.amap.com/navigation?from=${start[0]},${start[1]},我的位置&to=${end[0]},${end[1]},${activeNavSpot.name}&mode=car" target="_blank" class="block w-full py-2.5 bg-emerald-600 text-white rounded-xl text-center font-bold text-xs shadow-md">
                打开高德 App 发起实时导航 ↗
              </a>
            `;
          }
        });
      }
    }

    // 抽屉高度伸缩切换
    function toggleDrawerHeight() {
      const drawer = document.getElementById('bottom-drawer');
      const tip = document.getElementById('drawer-toggle-tip');
      const icon = document.getElementById('drawer-toggle-icon');
      isDrawerExpanded = !isDrawerExpanded;

      if (isDrawerExpanded) {
        drawer.style.height = '60dvh';
        tip.innerText = "下滑收起";
        icon.setAttribute('data-lucide', 'chevron-down');
      } else {
        drawer.style.height = '220px';
        tip.innerText = "上滑查看完整";
        icon.setAttribute('data-lucide', 'chevron-up');
      }
      lucide.createIcons();
    }

    // GPS 定位
    function getUserLocation() {
      const statusText = document.getElementById('gps-status-text');
      statusText.innerText = "正在获取手机 GPS 定位...";

      const geolocation = new AMap.Geolocation({
        enableHighAccuracy: true,
        timeout: 8000,
        needAddress: true
      });

      geolocation.getCurrentPosition(function(status, result) {
        if (status === 'complete') {
          userLocation = {
            lng: result.position.lng,
            lat: result.position.lat,
            isRealGps: true,
            name: result.formattedAddress ? result.formattedAddress.slice(0, 15) : "我的真实定位"
          };
          statusText.innerText = `GPS 已定位：${userLocation.name}`;
          map.setCenter([userLocation.lng, userLocation.lat]);
        } else {
          statusText.innerText = "定位受限，已使用新街口作为基准点";
        }
      });
    }

    // 切换天数筛选
    function filterDay(day) {
      currentDayFilter = day;
      document.querySelectorAll('.day-filter-btn').forEach(btn => {
        if (btn.dataset.day == day) {
          btn.className = "day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-emerald-600 text-white shadow-md transition";
        } else {
          btn.className = "day-filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full font-medium bg-white/95 text-slate-700 border border-slate-200/80 shadow-sm transition";
        }
      });
      render();
    }

    function focusSpot(id) {
      const spot = spots.find(s => s.id === id);
      if (spot) {
        map.setZoomAndCenter(15, [spot.lng, spot.lat]);
        openSpotPopup(spot);
      }
    }

    function updateSpotDay(spotId, day) {
      const spot = spots.find(s => s.id === spotId);
      if (spot) {
        spot.day = parseInt(day);
        render();
        openSpotPopup(spot);
      }
    }

    function deleteSpot(spotId) {
      if (confirm("确定从日程中移除此打卡点吗？")) {
        spots = spots.filter(s => s.id !== spotId);
        if (currentInfoWindow) currentInfoWindow.close();
        render();
      }
    }

    function toggleAddMode() {
      isAddMode = !isAddMode;
      const toast = document.getElementById('add-mode-toast');
      const btn = document.getElementById('add-mode-btn');
      if (isAddMode) {
        toast.classList.remove('hidden');
        btn.classList.add('bg-emerald-600', 'text-white');
        btn.classList.remove('bg-white', 'text-emerald-600');
      } else {
        toast.classList.add('hidden');
        btn.classList.remove('bg-emerald-600', 'text-white');
        btn.classList.add('bg-white', 'text-emerald-600');
      }
    }

    function handleMapPick(lng, lat) {
      const name = prompt("请输入此处的景点/打卡点名称：");
      if (!name) return;
      const tip = prompt("请输入攻略备忘或打卡理由：", "特色小吃 / 机位打卡");
      spots.push({
        id: Date.now(),
        name: name,
        category: "自定义",
        lng: lng,
        lat: lat,
        day: currentDayFilter === 'all' ? 1 : parseInt(currentDayFilter),
        timeNeeded: "1.5小时",
        transit: "自行前往",
        tip: tip || "自定义打卡点",
        cost: "免费"
      });
      toggleAddMode();
      render();
    }

    function handleManualSearch() {
      const val = document.getElementById('search-input').value.trim();
      if (!val) return;
      const placeSearch = new AMap.PlaceSearch({ city: '南京市' });
      placeSearch.search(val, function(status, result) {
        if (status === 'complete' && result.poiList && result.poiList.pois.length > 0) {
          const poi = result.poiList.pois[0];
          map.setZoomAndCenter(15, [poi.location.lng, poi.location.lat]);
          if (confirm(`找到地点：【${poi.name}】(${poi.address})，是否加入当前日程？`)) {
            spots.push({
              id: Date.now(),
              name: poi.name,
              category: poi.type ? poi.type.split(';')[0] : "搜索新增",
              lng: poi.location.lng,
              lat: poi.location.lat,
              day: currentDayFilter === 'all' ? 1 : parseInt(currentDayFilter),
              timeNeeded: "1.5小时",
              transit: poi.address,
              tip: poi.address,
              cost: "以现场为准"
            });
            render();
          }
        } else {
          alert("未在南京市搜索到该地点，请换个关键词尝试");
        }
      });
    }

    window.onload = () => {
      initMap();
      lucide.createIcons();
    };
  </script>
</body>
</html>
